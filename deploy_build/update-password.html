<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - DualMind Arena</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/auth-modern.css">

    <!-- Config & Supabase -->
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-init.js"></script>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <!-- Left Side: Hero -->
        <div class="auth-hero">
            <div class="logo-area">
                <img src="assets/logo.png" alt="DualMind Logo" class="logo-icon" style="height: 48px; width: auto;">
                <div class="logo-text">DualMind</div>
            </div>

            <h1 class="hero-title">Secure<br>Your Account</h1>
            <p class="hero-subtitle">
                Create a new strong password for your account.
            </p>
        </div>

        <!-- Right Side: Form -->
        <div class="auth-form-wrapper">
            <div class="form-header">
                <h2 class="form-title">Reset Password</h2>
                <p class="form-subtitle">Enter your new password below.</p>
            </div>

            <!-- Messages -->
            <div id="errorAlert" class="message error"></div>
            <div id="successAlert" class="message success"></div>

            <form id="updatePasswordForm">
                <!-- New Password Input -->
                <div class="input-group">
                    <input type="password" id="password" class="input-field" placeholder="New Password"
                        autocomplete="new-password" required minlength="6">
                    <i class="ri-lock-line input-icon"></i>
                </div>

                <!-- Confirm Password Input -->
                <div class="input-group" style="margin-top: 16px;">
                    <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm Password"
                        autocomplete="new-password" required minlength="6">
                    <i class="ri-lock-check-line input-icon"></i>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary" style="margin-top: 24px;">
                    <span class="btn-text">Update Password</span>
                    <span class="btn-icon"><i class="ri-check-line"></i></span>
                </button>
            </form>

            <div class="auth-footer">
                <a href="login-modern.html" class="link">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="js/update-password.js"></script>
</body>

</html>
