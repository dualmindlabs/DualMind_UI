<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DualMind Arena</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/auth-modern.css">

    <!-- Config & Supabase -->
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-init.js"></script>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <!-- Left Side: Hero -->
        <div class="auth-hero">
            <div class="logo-area">
                <img src="assets/logo.png" alt="DualMind Logo" class="logo-icon" style="height: 48px; width: auto;">
                <div class="logo-text">DualMind</div>
            </div>

            <h1 class="hero-title">Recover<br>Your Account</h1>
            <p class="hero-subtitle">
                Enter your email address and we'll send you a link to reset your password.
            </p>
        </div>

        <!-- Right Side: Form -->
        <div class="auth-form-wrapper">
            <div class="form-header">
                <h2 class="form-title">Forgot Password?</h2>
                <p class="form-subtitle">No worries, we'll help you get back in.</p>
            </div>

            <!-- Messages -->
            <div id="errorAlert" class="message error"></div>
            <div id="successAlert" class="message success"></div>

            <form id="forgotPasswordForm">
                <!-- Email Input -->
                <div id="emailGroup">
                    <div class="input-group">
                        <input type="email" id="email" class="input-field" placeholder="Email address"
                            autocomplete="email" required>
                        <i class="ri-mail-line input-icon"></i>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary" style="margin-top: 24px;">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-icon"><i class="ri-send-plane-fill"></i></span>
                </button>
            </form>

            <div class="auth-footer">
                Resulted in memory? <a href="login-modern.html" class="link">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="js/forgot-password.js"></script>
</body>

</html>
