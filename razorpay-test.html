<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment Testing - DualMind</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border: 1px solid #e5e7eb;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #4f46e5;
            border-radius: 8px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: 700;
        }

        h1 {
            color: #111827;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: white;
            color: #111827;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        input:hover, select:hover {
            border-color: #9ca3af;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
        }

        .amount-display {
            background: #f9fafb;
            color: #111827;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }

        .amount-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .amount-value {
            font-size: 28px;
            font-weight: 600;
            color: #4f46e5;
        }

        .payment-methods {
            margin-bottom: 25px;
        }

        .methods-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .method-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .method-item:hover {
            background: #fff;
            border-color: #4f46e5;
        }

        .method-item input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }

        .method-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
            color: #374151;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #4338ca;
        }

        .btn:active {
            background: #3730a3;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info-box {
            background: #eff6ff;
            border-left: 3px solid #3b82f6;
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #1e40af;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .status-message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            display: block;
        }

        .status-message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }

        .status-message.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            display: block;
        }

        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 25px 0;
        }

        .quick-amounts {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-amount-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            transition: all 0.2s ease;
        }

        .quick-amount-btn:hover {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .methods-grid {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">DM</div>
            <h1>DualMind Payment</h1>
            <p class="subtitle">Secure Payment Gateway Testing</p>
        </div>

        <div class="info-box">
            <strong>ℹ️ Test Mode Active</strong>
            Using Razorpay Test Key: rzp_test_1DP5mmOlF5G5ag
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <div class="input-wrapper">
                    <input type="number" id="amount" name="amount" min="1" step="0.01" value="100" required>
                    <span class="input-icon">₹</span>
                </div>
                <div class="quick-amounts">
                    <span class="quick-amount-btn" data-amount="100">₹100</span>
                    <span class="quick-amount-btn" data-amount="500">₹500</span>
                    <span class="quick-amount-btn" data-amount="1000">₹1,000</span>
                    <span class="quick-amount-btn" data-amount="2000">₹2,000</span>
                </div>
            </div>

            <div class="amount-display">
                <div class="amount-label">Total Amount</div>
                <div class="amount-value" id="displayAmount">₹100.00</div>
            </div>

            <div class="form-group">
                <label for="orderId">Order ID</label>
                <div class="input-wrapper">
                    <input type="text" id="orderId" name="orderId" value="ORD-" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" name="phone" value="9327252901" required pattern="[0-9]{10}">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" value="demo@dualmind.com" required>
                </div>
            </div>

            <div class="form-group payment-methods">
                <label>Payment Methods</label>
                <div class="methods-grid">
                    <div class="method-item">
                        <input type="checkbox" id="method_upi" checked>
                        <label for="method_upi">UPI</label>
                    </div>
                    <div class="method-item">
                        <input type="checkbox" id="method_card" checked>
                        <label for="method_card">Card</label>
                    </div>
                    <div class="method-item">
                        <input type="checkbox" id="method_netbanking" checked>
                        <label for="method_netbanking">Net Banking</label>
                    </div>
                    <div class="method-item">
                        <input type="checkbox" id="method_wallet" checked>
                        <label for="method_wallet">Wallet</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn" id="payButton">
                <span id="buttonText">Proceed to Payment</span>
            </button>
        </form>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        // Razorpay Configuration
        const razorpayKey = 'rzp_test_1DP5mmOlF5G5ag';

        // DOM Elements
        const paymentForm = document.getElementById('paymentForm');
        const amountInput = document.getElementById('amount');
        const displayAmount = document.getElementById('displayAmount');
        const orderIdInput = document.getElementById('orderId');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');
        const payButton = document.getElementById('payButton');
        const buttonText = document.getElementById('buttonText');
        const statusMessage = document.getElementById('statusMessage');

        // Generate random order ID on load
        function generateOrderId() {
            const timestamp = Date.now();
            const random = Math.floor(Math.random() * 1000);
            return `ORD-${timestamp}-${random}`;
        }

        // Initialize order ID
        orderIdInput.value = generateOrderId();

        // Update display amount when input changes
        amountInput.addEventListener('input', function() {
            let amount = parseFloat(this.value);
            if (isNaN(amount) || amount < 0) {
                amount = 0;
            }
            displayAmount.textContent = `₹${amount.toFixed(2)}`;
        });

        // Quick amount buttons
        document.querySelectorAll('.quick-amount-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const amount = parseFloat(this.getAttribute('data-amount'));
                if (!isNaN(amount) && amount > 0) {
                    amountInput.value = amount;
                    displayAmount.textContent = `₹${amount.toFixed(2)}`;
                    amountInput.focus();
                }
            });
        });

        // Show status message
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            setTimeout(() => {
                statusMessage.className = 'status-message';
            }, 5000);
        }

        // Initialize Razorpay
        let razorpayInstance = null;

        function initRazorpay() {
            if (typeof Razorpay === 'undefined') {
                showStatus('Razorpay SDK failed to load. Please check your internet connection.', 'error');
                return false;
            }
            return true;
        }

        // Handle payment form submission
        paymentForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!initRazorpay()) {
                return;
            }

            // Get form values
            const amount = parseFloat(amountInput.value);
            const orderId = orderIdInput.value.trim();
            const phone = phoneInput.value.trim();
            const email = emailInput.value.trim();

            // Validation
            if (!amount || amount <= 0 || isNaN(amount)) {
                showStatus('Please enter a valid amount greater than 0', 'error');
                amountInput.focus();
                return;
            }

            if (amount < 1) {
                showStatus('Minimum amount is ₹1.00', 'error');
                amountInput.focus();
                return;
            }

            if (!orderId || orderId.length < 3) {
                showStatus('Please enter a valid order ID', 'error');
                orderIdInput.focus();
                return;
            }

            if (!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) {
                showStatus('Please enter a valid 10-digit phone number', 'error');
                phoneInput.focus();
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                showStatus('Please enter a valid email address', 'error');
                emailInput.focus();
                return;
            }

            // Get selected payment methods
            const methods = {
                upi: document.getElementById('method_upi').checked,
                card: document.getElementById('method_card').checked,
                netbanking: document.getElementById('method_netbanking').checked,
                wallet: document.getElementById('method_wallet').checked
            };

            // Check if at least one payment method is selected
            if (!methods.upi && !methods.card && !methods.netbanking && !methods.wallet) {
                showStatus('Please select at least one payment method', 'error');
                return;
            }

            // Build payment options
            const options = {
                key: razorpayKey,
                amount: Math.round(amount * 100), // Convert to paise
                name: 'DualMind',
                description: `Bill #${orderId}`,
                prefill: {
                    contact: phone,
                    email: email
                },
                theme: {
                    color: '#4f46e5'
                },
                method: {},
                external: {
                    wallets: ['paytm']
                },
                handler: function(response) {
                    // Payment success handler
                    showStatus(
                        `Payment Successful! Payment ID: ${response.razorpay_payment_id}`,
                        'success'
                    );
                    console.log('Payment Success:', response);
                    
                    // Generate new order ID for next payment
                    orderIdInput.value = generateOrderId();
                    
                    // Reset button state
                    payButton.disabled = false;
                    buttonText.textContent = 'Proceed to Payment';
                },
                modal: {
                    ondismiss: function() {
                        showStatus('Payment cancelled by user', 'info');
                        payButton.disabled = false;
                        buttonText.textContent = 'Proceed to Payment';
                    }
                }
            };

            // Add payment methods
            if (methods.upi) options.method.upi = true;
            if (methods.card) options.method.card = true;
            if (methods.netbanking) options.method.netbanking = true;
            if (methods.wallet) options.method.wallet = true;

            // Disable button during payment
            payButton.disabled = true;
            buttonText.innerHTML = '<span class="loading"></span>Processing...';

            try {
                // Create Razorpay instance
                razorpayInstance = new Razorpay(options);
                
                // Open payment dialog
                razorpayInstance.open();
                
                // Note: Button will be re-enabled in handler or modal.ondismiss

            } catch (error) {
                showStatus(`Error: ${error.message || 'Failed to initialize payment'}. Please try again.`, 'error');
                console.error('Razorpay Error:', error);
                payButton.disabled = false;
                buttonText.textContent = 'Proceed to Payment';
            }
        });

        // Handle payment errors
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('razorpay')) {
                showStatus('Razorpay SDK error. Please refresh the page.', 'error');
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check if Razorpay is already loaded
            if (typeof Razorpay !== 'undefined') {
                showStatus('Razorpay SDK loaded successfully. Ready for testing!', 'success');
            } else {
                // Wait a bit for the script to load
                setTimeout(function() {
                    if (initRazorpay()) {
                        showStatus('Razorpay SDK loaded successfully. Ready for testing!', 'success');
                    }
                }, 500);
            }
        });

        // Auto-format phone number
        phoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 10);
        });

        // Auto-format amount
        amountInput.addEventListener('blur', function() {
            const value = parseFloat(this.value);
            if (!isNaN(value) && value > 0) {
                this.value = value.toFixed(2);
                displayAmount.textContent = `₹${value.toFixed(2)}`;
            } else if (this.value && (isNaN(value) || value <= 0)) {
                this.value = '100';
                displayAmount.textContent = '₹100.00';
            }
        });
    </script>
</body>
</html>
