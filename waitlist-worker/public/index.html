<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DualMind - Waitlist</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #020205;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Raymarched AcidSquares WebGL Canvas Container */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* Space overlay for depth & seamless gradient blend */
    .space-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 45%, transparent 20%, rgba(2, 2, 5, 0.75) 85%),
                  linear-gradient(to bottom, rgba(2,2,5,0.4) 0%, transparent 40%, rgba(2,2,5,0.9) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Curved planet horizon from the waitlist design */
    .horizon {
      position: absolute;
      bottom: -600px;
      left: 50%;
      transform: translateX(-50%);
      width: 1700px;
      height: 800px;
      border-radius: 50%;
      background: #020205;
      box-shadow: 0 -20px 60px -5px rgba(74, 171, 194, 0.4),
                  0 -2px 15px rgba(168, 85, 247, 0.3);
      z-index: 3;
      pointer-events: none;
    }

    /* Foreground Content */
    .waitlist-container {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 620px;
      padding: 24px;
      pointer-events: none;
    }

    .interactive-elements {
      pointer-events: auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 18px;
      border-radius: 100px;
      margin-bottom: 24px;
    }
    
    .badge-dot {
      width: 6px;
      height: 6px;
      background: #4AABC2;
      border-radius: 50%;
      box-shadow: 0 0 8px #4AABC2;
    }

    .title {
      font-size: clamp(34px, 5.5vw, 56px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
    }
    
    .title em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: #E2D7FF;
      letter-spacing: -0.5px;
    }

    .description {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 36px;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* Waitlist Input Group */
    .input-group {
      display: flex;
      background: rgba(14, 15, 23, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .input-group:focus-within {
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.25), 0 0 10px rgba(74, 171, 194, 0.2);
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      padding: 0 16px;
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .submit-btn {
      background: #ffffff;
      color: #020205;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 14px;
      border: none;
      padding: 12px 24px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: rgba(255, 255, 255, 0.92);
      transform: scale(0.98);
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    
    .message.success { color: #10b981; }
    .message.error { color: #ef4444; }
  </style>
</head>
<body>

  <!-- AcidSquares Canvas Container -->
  <div id="canvas-container"></div>
  <div class="space-overlay"></div>
  <div class="horizon"></div>

  <!-- Foreground Content -->
  <div class="waitlist-container">
    <div class="badge">
      <span class="badge-dot"></span>
      DualMind • Waitlist
    </div>
    
    <h1 class="title">Good things come<br>to those <em>who wait.</em></h1>
    
    <p class="description">
      Launch your very own waitlist, grow your mailing list all while building the hype for launch day.
    </p>

    <div class="interactive-elements">
      <form id="waitlistForm">
        <div class="input-group">
          <input type="email" id="email" class="input-field" placeholder="Your Email Address" required autocomplete="email">
          <button type="submit" id="submitBtn" class="submit-btn">Get Notified</button>
        </div>
      </form>
      <div id="statusMessage" class="message"></div>
    </div>
  </div>

  <!-- WebGL AcidSquares Engine -->
  <script type="module">
    import { Renderer, Program, Mesh, Triangle } from 'https://cdn.jsdelivr.net/npm/ogl@0.0.32/dist/ogl.mjs';

    const vertexShader = `#version 300 es
      in vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentShader = `#version 300 es
      precision highp float;
      uniform vec2 iResolution;
      uniform float iTime;
      uniform float uSpeed;
      uniform float uWaveDepth;
      uniform float uZoom;
      uniform float uDensity;
      uniform float uSpread;
      uniform float uStepSize;
      uniform float uGlow;
      uniform float uExposure;
      uniform float uColorShift;
      uniform float uContrast;
      uniform float uBrightness;
      uniform float uOpacity;
      uniform float uSteps;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec2 uMouse;
      uniform float uMouseStrength;
      uniform float uMouseRadius;
      uniform float uEnableMouse;
      uniform float uMouseActive;
      uniform float uGrain;
      uniform float uGrainIntensity;
      out vec4 fragColor;

      void main() {
        vec2 frag = gl_FragCoord.xy;
        float zoom = max(uZoom, 0.05);
        float aspect = iResolution.x / iResolution.y;
        vec2 ndc = (2.0 * frag - iResolution.xy) / iResolution.y;
        vec2 dir = ndc * (0.5 / zoom);

        vec2 mouseNdc = vec2(uMouse.x * aspect, uMouse.y);
        float mr = max(uMouseRadius, 0.01);
        vec2 md = ndc - mouseNdc;
        float dent = exp(-dot(md, md) / (mr * mr)) * (3.0 * uMouseStrength * uEnableMouse * uMouseActive);

        float travel = sin(iTime * uSpeed) * uWaveDepth;
        float density = max(uDensity, 1.0);
        float spread = clamp(uSpread, 0.05, 0.6);
        float stepSize = max(uStepSize, 0.0005);
        float glowGain = max(uGlow, 0.0);

        vec3 tOffset = vec3(0.0, dent, travel);
        vec3 p = vec3(0.0);
        float s = 0.0;
        float glow = 0.0;

        for (int i = 0; i < 64; i++) {
          if (float(i) >= uSteps) break;
          p += vec3(dir * s, s);
          vec3 q = p + tOffset;
          s += density - length(q.xz) + length(ceil(q).xy);
          s = stepSize + abs(s) * spread;
          glow += glowGain / s;
        }

        float e = glow / max(uExposure, 1.0);
        float shimmer = 0.5 + 0.5 * dot(cos(iTime * uColorShift + p), vec3(0.3333));
        float v = tanh(e * uBrightness * mix(0.7, 1.05, shimmer));
        v = clamp((v - 0.5) * uContrast + 0.5, 0.0, 1.0);

        vec3 col = mix(uColor1, uColor2, smoothstep(0.0, 0.55, v));
        col = mix(col, uColor3, smoothstep(0.55, 1.0, v));
        col *= v;

        float a = clamp(v, 0.0, 1.0) * uOpacity;
        vec3 outRgb = col * a;
        if (uGrain > 0.5) {
          float gv = (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + iTime) * 43758.5453) - 0.5) * uGrainIntensity;
          outRgb = clamp(outRgb + gv, 0.0, 1.0);
          a = clamp(a + gv, 0.0, 1.0);
        }
        fragColor = vec4(outRgb, a);
      }
    `;

    const hexToRgb = hex => {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? [parseInt(result[1], 16) / 255, parseInt(result[2], 16) / 255, parseInt(result[3], 16) / 255] : [1, 1, 1];
    };

    const container = document.getElementById('canvas-container');
    const renderer = new Renderer({ webgl: 2, alpha: true, antialias: false, dpr: Math.min(window.devicePixelRatio || 1, 2) });
    const gl = renderer.gl;
    container.appendChild(gl.canvas);

    const geometry = new Triangle(gl);
    const program = new Program(gl, {
      vertex: vertexShader,
      fragment: fragmentShader,
      uniforms: {
        iTime: { value: 0 },
        iResolution: { value: new Float32Array([1, 1]) },
        uSpeed: { value: 0.6 },
        uWaveDepth: { value: 0.9 },
        uZoom: { value: 1.35 },
        uDensity: { value: 10.0 },
        uSpread: { value: 0.3 },
        uStepSize: { value: 0.002 },
        uGlow: { value: 1.0 },
        uExposure: { value: 2600 },
        uColorShift: { value: 0.1 },
        uContrast: { value: 1.05 },
        uBrightness: { value: 1.05 },
        uOpacity: { value: 0.9 },
        uSteps: { value: 32 },
        uColor1: { value: new Float32Array(hexToRgb('#13092b')) },
        uColor2: { value: new Float32Array(hexToRgb('#8b5cf6')) },
        uColor3: { value: new Float32Array(hexToRgb('#4aabc2')) },
        uMouse: { value: new Float32Array([0, 0]) },
        uMouseStrength: { value: 0.1 },
        uMouseRadius: { value: 0.35 },
        uEnableMouse: { value: 1.0 },
        uMouseActive: { value: 0.0 },
        uGrain: { value: 1.0 },
        uGrainIntensity: { value: 0.04 }
      }
    });

    const mesh = new Mesh(gl, { geometry, program });

    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      renderer.setSize(width, height);
      program.uniforms.iResolution.value[0] = gl.drawingBufferWidth;
      program.uniforms.iResolution.value[1] = gl.drawingBufferHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const mouse = { x: 0, y: 0, active: 0 };
    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2.0;
      mouse.y = -(e.clientY / window.innerHeight - 0.5) * 2.0;
      mouse.active = 1.0;
    });

    function update(t) {
      requestAnimationFrame(update);
      program.uniforms.iTime.value = t * 0.001;
      
      program.uniforms.uMouse.value[0] += (mouse.x - program.uniforms.uMouse.value[0]) * 0.06;
      program.uniforms.uMouse.value[1] += (mouse.y - program.uniforms.uMouse.value[1]) * 0.06;
      program.uniforms.uMouseActive.value += (mouse.active - program.uniforms.uMouseActive.value) * 0.06;
      
      renderer.render({ scene: mesh });
    }
    requestAnimationFrame(update);

    // Form submission
    const form = document.getElementById('waitlistForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        // Save email
        statusMsg.textContent = "You're on the list! We'll notify you soon.";
        statusMsg.className = "message success";
        statusMsg.style.display = "block";
        form.reset();
      } catch (err) {
        statusMsg.textContent = "Unable to register right now. Please try again.";
        statusMsg.className = "message error";
        statusMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get Notified';
      }
    });
  </script>
</body>
</html>
