<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DualMind - AI Battle Arena for comparing language models">
  <meta name="theme-color" content="#000000">
  
  <title>DualMind - Battle Arena</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Inria+Sans:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/auth-styles.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 21 21'><rect width='9' height='9' rx='1' fill='%23577B87'/><rect x='12' width='9' height='9' rx='1' fill='%234AABC2'/><rect x='12' y='12' width='9' height='9' rx='1' fill='%23CB9275'/><rect y='12' width='9' height='9' rx='1' fill='%23FDF4CD'/></svg>">
  
  <!-- Config -->
  <script src="./config.js"></script>
  
  <!-- Supabase Auth Initialization (Auto-initializes if configured) -->
  <script src="./js/supabase-init.js"></script>
</head>
<body>
  <a class="skip-link" href="#chat-input">Skip to chat input</a>
  <!-- Main App Container -->
  <div id="app">
    <!-- Background Image -->
    <img 
      src="./assets/battleimage 1.png" 
      alt="" 
      class="app-background"
      loading="eager"
    />
    
    <!-- Sidebar Component Container -->
    <div id="sidebar-container"></div>
    
    <!-- Header Component Container -->
    <div id="header-container"></div>
    
    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <!-- Chat messages will be rendered here -->
    </main>
    
    <!-- Chat Input Component Container -->
    <div id="chat-input-container"></div>
  </div>

  <!-- App Scripts (ES Modules) -->
  <script type="module" src="./js/app-final.js"></script>
  
  <!-- Fallback for browsers without module support -->
  <script nomodule>
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px;">
        <div>
          <h1>Browser Not Supported</h1>
          <p>Please use a modern browser like Chrome, Firefox, Safari, or Edge.</p>
        </div>
      </div>
    `;
  </script>
</body>
</html>
