<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DualMind Arena</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/auth-modern.css">

    <!-- Config & Supabase -->
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-init.js"></script>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <!-- Left Side: Hero -->
        <div class="auth-hero">
            <div class="logo-area">
                <img src="assets/logo.png" alt="DualMind Logo" class="logo-icon" style="height: 48px; width: auto;">
                <div class="logo-text">DualMind</div>
            </div>

            <h1 class="hero-title">Join the<br>Arena</h1>
            <p class="hero-subtitle">
                Create your account to track your voting history, participate in leaderboard challenges, and more.
            </p>
        </div>

        <!-- Right Side: Form -->
        <div class="auth-form-wrapper">
            <div class="form-header">
                <h2 class="form-title">Create Account</h2>
                <p class="form-subtitle">Start your journey today</p>
            </div>

            <!-- Messages -->
            <div id="errorAlert" class="message error"></div>
            <div id="successAlert" class="message success"></div>

            <form id="signupForm">
                <div class="input-group">
                    <input type="email" id="email" class="input-field" placeholder="Email address" required>
                    <i class="ri-mail-line input-icon"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="password" class="input-field" placeholder="Create password" required
                        minlength="6">
                    <i class="ri-lock-line input-icon"></i>
                </div>

                <div class="input-group" style="margin-bottom: 24px;">
                    <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm password"
                        required minlength="6">
                    <i class="ri-shield-check-line input-icon"></i>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">
                    <span class="btn-text">Sign Up</span>
                    <span class="btn-icon"><i class="ri-user-add-line"></i></span>
                </button>
            </form>

            <div class="divider">or sign up with</div>

            <div class="social-buttons">
                <button class="btn-social" id="socialGitHub">
                    <i class="ri-github-fill" style="font-size: 20px;"></i>
                    GitHub
                </button>
                <button class="btn-social" id="socialGoogle">
                    <i class="ri-google-fill" style="font-size: 20px;"></i>
                    Google
                </button>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login-modern.html" class="link">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/resend-auth-email.js"></script>

    <!-- Simple Signup Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = window.supabase.createClient(window.DUALMIND_CONFIG.supabase.url, window.DUALMIND_CONFIG.supabase.anonKey);
            if (window.DualMindResendEmail?.registerClient) {
                window.DualMindResendEmail.registerClient(supabase);
            }
            const form = document.getElementById('signupForm');
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorAlert.style.display = 'none';
                successAlert.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.querySelector('.btn-text').textContent = 'Creating Account...';

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    errorAlert.textContent = 'Passwords do not match';
                    errorAlert.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.querySelector('.btn-text').textContent = 'Sign Up';
                    return;
                }

                try {
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password
                    });

                    if (error) throw error;

                    if (data.session && window.DualMindResendEmail) {
                        window.DualMindResendEmail.syncSession(data.session);
                        if (window.DUALMIND_CONFIG?.email?.sendWelcomeOnSignUp !== false) {
                            void window.DualMindResendEmail.sendWelcome({
                                redirectUrl: `${window.location.origin}/index.html`
                            });
                        }
                    }

                    successAlert.textContent = 'Account created! Please check your email to verify.';
                    successAlert.style.display = 'block';
                    form.reset();
                } catch (err) {
                    errorAlert.textContent = err.message;
                    errorAlert.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.querySelector('.btn-text').textContent = 'Sign Up';
                }
            });

            // Social Login Handlers (Reuse from login)
            document.getElementById('socialGitHub').addEventListener('click', async () => {
                await supabase.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: window.location.origin + '/index.html' } });
            });
            document.getElementById('socialGoogle').addEventListener('click', async () => {
                await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/index.html' } });
            });
        });
    </script>
</body>

</html>
