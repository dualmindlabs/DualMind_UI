<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DualMind Arena</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/auth-modern.css">

    <!-- Config & Supabase -->
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-init.js"></script>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <!-- Left Side: Hero -->
        <div class="auth-hero">
            <div class="logo-area">
                <img src="assets/logo.png" alt="DualMind Logo" class="logo-icon" style="height: 48px; width: auto;">
                <div class="logo-text">DualMind</div>
            </div>

            <h1 class="hero-title">Battle of<br>Intelligence</h1>
            <p class="hero-subtitle">
                Compare top AI models side-by-side. Vote for the best responses and climb the leaderboard.
            </p>
        </div>

        <!-- Right Side: Form -->
        <div class="auth-form-wrapper">
            <div class="form-header">
                <h2 class="form-title">Welcome Back</h2>
                <p class="form-subtitle">Sign in to continue your journey</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-mode="email">Email</button>
                <button class="auth-tab" data-mode="phone">Phone</button>
            </div>

            <!-- Messages -->
            <div id="errorAlert" class="message error"></div>
            <div id="successAlert" class="message success"></div>

            <form id="modernAuthForm">
                <!-- Email Inputs -->
                <div id="emailGroup">
                    <div class="input-group">
                        <input type="email" id="email" class="input-field" placeholder="Email address"
                            autocomplete="email">
                        <i class="ri-mail-line input-icon"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div id="passwordGroup">
                    <div class="input-group">
                        <input type="password" id="password" class="input-field" placeholder="Password"
                            autocomplete="current-password">
                        <i class="ri-lock-line input-icon"></i>
                    </div>
                </div>

                <!-- Phone Inputs -->
                <div id="phoneGroup" style="display: none; flex-direction: column;">
                    <div class="input-group phone-group">
                        <div class="country-code">+91</div>
                        <input type="tel" id="phone" class="input-field" placeholder="Phone number"
                            style="padding-left: 16px;">
                    </div>
                </div>

                <!-- OTP Input -->
                <div id="otpGroup" style="display: none;">
                    <div class="input-group">
                        <input type="text" id="otp" class="input-field" placeholder="Enter 6-digit code" maxlength="6"
                            pattern="\d*">
                        <i class="ri-shield-keyhole-line input-icon"></i>
                    </div>
                </div>

                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="forgot-password.html" id="forgotLink" class="link" style="font-size: 13px;">Forgot
                        password?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-icon"><i class="ri-arrow-right-line"></i></span>
                </button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-buttons">
                <button class="btn-social" id="socialGitHub">
                    <i class="ri-github-fill" style="font-size: 20px;"></i>
                    GitHub
                </button>
                <button class="btn-social" id="socialGoogle">
                    <i class="ri-google-fill" style="font-size: 20px;"></i>
                    Google
                </button>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="signup-modern.html" class="link">Sign up free</a>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="js/resend-auth-email.js"></script>
    <script src="js/auth-modern.js"></script>
</body>

</html>
