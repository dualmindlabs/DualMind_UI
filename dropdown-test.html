<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Test - DualMind UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0b0c15;
            color: white;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Test container matching the actual app structure */
        .test-container {
            width: 100%;
            max-width: 800px;
            padding: 40px;
        }
        
        .chat-empty {
            padding: 60px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 700px;
            margin: 0 auto;
            background: rgba(20, 22, 35, 0.8);
            border-radius: 20px;
        }
        
        .model-selector-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: end;
            max-width: 600px;
            margin: 32px auto;
            padding: 24px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
        
        .model-selector-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .model-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* SIMPLIFIED SELECT - No complex styling that could break it */
        .model-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color-scheme: dark;
        }
        
        .model-select:hover {
            border-color: rgba(74, 171, 194, 0.4);
        }
        
        .model-select:focus {
            outline: none;
            border-color: rgba(74, 171, 194, 0.6);
            box-shadow: 0 0 0 3px rgba(74, 171, 194, 0.1);
        }
        
        .model-select option {
            background: #1a1b2e;
            color: white;
            padding: 10px;
        }
        
        .icon-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            cursor: pointer;
        }
        
        .secondary-btn {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .model-selector-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8px;
        }
        
        h2 {
            font-size: 28px;
            margin-bottom: 32px;
        }
        
        .debug-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #4ade80;
            text-align: left;
        }
        
        .debug-info h3 {
            color: white;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .model-selector-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
            
            .model-selector-actions {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="chat-empty">
            <h2>Side-by-Side Comparison</h2>
            
            <div class="model-selector-grid">
                <div class="model-selector-column">
                    <label class="model-label">Left Model</label>
                    <select id="model-select-left" class="model-select">
                        <option value="">🎲 Random</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="claude-3">Claude 3</option>
                        <option value="gemini">Gemini Pro</option>
                    </select>
                </div>
                
                <div class="model-selector-actions">
                    <button id="swap-models-btn" class="icon-btn" title="Swap models">⇄</button>
                    <button id="random-pair-btn" class="secondary-btn">🎲 Random Pair</button>
                </div>
                
                <div class="model-selector-column">
                    <label class="model-label">Right Model</label>
                    <select id="model-select-right" class="model-select">
                        <option value="">🎲 Random</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="claude-3">Claude 3</option>
                        <option value="gemini">Gemini Pro</option>
                    </select>
                </div>
            </div>
            
            <p style="margin-top: 24px; opacity: 0.6; font-size: 14px;">
                Select models above, then type your prompt below
            </p>
        </div>
        
        <div class="debug-info" id="debug-output">
            <h3>Debug Output:</h3>
            <div id="debug-content">Click on the dropdowns above. If they work, the issue is in the JavaScript or complex CSS of the main app.</div>
        </div>
    </div>

    <script>
        // Simple event listeners to test functionality
        const leftSelect = document.getElementById('model-select-left');
        const rightSelect = document.getElementById('model-select-right');
        const debugContent = document.getElementById('debug-content');
        
        function log(message) {
            console.log(message);
            debugContent.innerHTML += '<br>' + message;
        }
        
        // Test if selects are clickable
        leftSelect.addEventListener('click', () => {
            log('✅ LEFT select clicked - dropdown is clickable!');
        });
        
        leftSelect.addEventListener('change', (e) => {
            log(`✅ LEFT model changed to: ${e.target.value}`);
        });
        
        rightSelect.addEventListener('click', () => {
            log('✅ RIGHT select clicked - dropdown is clickable!');
        });
        
        rightSelect.addEventListener('change', (e) => {
            log(`✅ RIGHT model changed to: ${e.target.value}`);
        });
        
        // Swap button
        document.getElementById('swap-models-btn').addEventListener('click', () => {
            const temp = leftSelect.value;
            leftSelect.value = rightSelect.value;
            rightSelect.value = temp;
            log(`🔄 Models swapped!`);
        });
        
        // Random pair button
        document.getElementById('random-pair-btn').addEventListener('click', () => {
            const options = ['gpt-4', 'claude-3', 'gemini'];
            leftSelect.value = options[Math.floor(Math.random() * options.length)];
            rightSelect.value = options[Math.floor(Math.random() * options.length)];
            log(`🎲 Random pair selected!`);
        });
        
        // Check if selects are disabled
        log(`Left select disabled: ${leftSelect.disabled}`);
        log(`Right select disabled: ${rightSelect.disabled}`);
        log(`Left select pointer-events: ${getComputedStyle(leftSelect).pointerEvents}`);
        log(`Testing complete. Try clicking the dropdowns!`);
    </script>
</body>
</html>
