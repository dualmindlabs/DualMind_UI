<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmation - DualMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Inria+Sans:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inria Sans', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: 400px;
    }

    .logo {
      margin-bottom: 30px;
    }

    .logo-icon {
      display: inline-block;
      width: 60px;
      height: 60px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-family: 'Do Hyeon', sans-serif;
    }

    p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
      font-size: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #4AABC2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
    }

    .message.success {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #69f0ae;
    }

    .message.error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #ff6b6b;
    }

    .link {
      color: #4AABC2;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .link:hover {
      color: white;
    }
  </style>
  <script src="./config.js"></script>
</head>

<body>
  <div class="container">
    <div class="logo">
      <img src="./assets/logo.png" alt="DualMind Logo" class="logo-icon" style="width: 60px; height: auto;">
    </div>

    <h1 id="title">Confirming Email...</h1>
    <p id="message">Please wait while we confirm your email address.</p>

    <div class="spinner" id="spinner"></div>

    <div id="status" style="display: none;">
      <!-- Will be updated by script -->
    </div>

    <p style="margin-top: 40px; font-size: 13px;">
      Redirecting to <a class="link" href="./index.html">DualMind</a> in <span id="countdown">5</span> seconds...
    </p>
  </div>

  <script type="module">
    import { initializeSupabaseAuth } from './js/supabase-auth.js';

    const supabaseConfig = window.DUALMIND_CONFIG.supabase;

    if (!supabaseConfig.url || supabaseConfig.url.includes('your-project')) {
      document.getElementById('title').textContent = 'Configuration Error';
      document.getElementById('message').innerHTML = 'Supabase not configured. <a class="link" href="./login.html">Back to login</a>';
      document.getElementById('spinner').style.display = 'none';
      return;
    }

    const auth = initializeSupabaseAuth(supabaseConfig.url, supabaseConfig.anonKey);
    const spinner = document.getElementById('spinner');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    const countdown = document.getElementById('countdown');

    let countdownValue = 5;

    // Check hash for email confirmation token
    const hash = window.location.hash;

    if (hash && hash.includes('type=recovery')) {
      // Password reset flow
      handlePasswordReset();
    } else if (hash && hash.includes('type=email')) {
      // Email confirmation flow (Supabase v2 automatically confirms on redirect)
      handleEmailConfirmation();
    } else {
      // No token in URL
      spinner.style.display = 'none';
      title.textContent = 'No Confirmation Link';
      message.textContent = 'It looks like you may have already confirmed your email.';
      status.style.display = 'block';
      status.innerHTML = '<div class="message success">You can now <a class="link" href="./login.html">log in</a> with your account.</div>';
    }

    function handleEmailConfirmation() {
      setTimeout(() => {
        spinner.style.display = 'none';
        title.textContent = '✅ Email Confirmed!';
        message.textContent = 'Your email has been verified. You can now use all features.';
        status.style.display = 'block';
        status.innerHTML = '<div class="message success">Redirecting to app...</div>';

        // Redirect after countdown
        const redirectInterval = setInterval(() => {
          countdownValue--;
          countdown.textContent = countdownValue;

          if (countdownValue <= 0) {
            clearInterval(redirectInterval);
            // FORCE LOCALHOST PORT 8000
            if (window.location.hostname === 'localhost') {
              window.location.href = 'http://localhost:8000/index.html';
            } else {
              window.location.href = './index.html';
            }
          }
        }, 1000);
      }, 1500);
    }

    function handlePasswordReset() {
      // Extract reset token from URL
      const params = new URLSearchParams(hash.substring(1));
      const accessToken = params.get('access_token');
      const type = params.get('type');

      if (accessToken && type === 'recovery') {
        // Store the reset token and redirect to password reset page
        sessionStorage.setItem('resetToken', accessToken);

        spinner.style.display = 'none';
        title.textContent = '🔐 Reset Your Password';
        message.textContent = 'You can now set a new password for your account.';
        status.style.display = 'block';
        status.innerHTML = `
          <div style="margin: 20px 0;">
            <input type="password" id="newPassword" placeholder="New password" 
              style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; margin-bottom: 10px;">
            <input type="password" id="confirmPassword" placeholder="Confirm password"
              style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; margin-bottom: 10px;">
            <button onclick="resetPassword()" style="width: 100%; padding: 10px; background: #4AABC2; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold;">
              Reset Password
            </button>
          </div>
        `;

        window.resetPassword = async function () {
          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          if (!newPassword || !confirmPassword) {
            alert('Please fill in both password fields');
            return;
          }

          if (newPassword !== confirmPassword) {
            alert('Passwords do not match');
            return;
          }

          if (newPassword.length < 6) {
            alert('Password must be at least 6 characters');
            return;
          }

          try {
            const result = await auth.changePassword(newPassword);
            if (result.success) {
              spinner.style.display = 'none';
              title.textContent = '✅ Password Reset!';
              message.textContent = 'Your password has been successfully updated.';
              status.innerHTML = '<div class="message success">Redirecting to login...</div>';

              setTimeout(() => {
                window.location.href = './login.html';
              }, 2000);
            } else {
              alert('Error: ' + result.error);
            }
          } catch (error) {
            alert('Error resetting password: ' + error.message);
          }
        };
      }
    }
  </script>
</body>

</html>
