<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating - DualMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Inria+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inria Sans', sans-serif;
      background: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .logo {
      margin-bottom: 30px;
    }

    .logo-icon {
      display: inline-block;
      width: 60px;
      height: 60px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
      font-size: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .link {
      color: #3b82f6;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <!-- Simple Logo Placeholder -->
       <svg width="60" height="60" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="9" height="9" rx="1" fill="#577B87"/>
        <rect x="12" width="9" height="9" rx="1" fill="#4AABC2"/>
        <rect x="12" y="12" width="9" height="9" rx="1" fill="#CB9275"/>
        <rect y="12" width="9" height="9" rx="1" fill="#FDF4CD"/>
      </svg>
    </div>

    <h1 id="title">Authenticating...</h1>
    <p id="message">Please wait while we log you in.</p>
    
    <div class="spinner" id="spinner"></div>

    <div id="status" style="display: none;">
      <!-- Will be updated by script -->
    </div>
  </div>

  <script type="module">
    import { initializeSupabaseAuth } from './js/supabase-auth.js';

    const supabaseConfig = window.DUALMIND_CONFIG.supabase;
    
    if (!supabaseConfig.url || supabaseConfig.url.includes('your-project')) {
      showError('Supabase not configured. <a class="link" href="./login/index.html">Back to login</a>');
      return;
    }

    const auth = initializeSupabaseAuth(supabaseConfig.url, supabaseConfig.anonKey);

    const spinner = document.getElementById('spinner');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    
    // Check hash for email confirmation token or OAuth token
    const hash = window.location.hash;
    
    // Listen for auth state change
    let authListener = auth.supabase.auth.onAuthStateChange((event, session) => {
      console.log('Auth state change in callback:', event, session);
      if (event === 'SIGNED_IN' && session) {
        handleSuccess(session);
      }
    });

    // Fallback: Check if session is already present (e.g. implicitly handled)
    setTimeout(() => {
        auth.supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                handleSuccess(session);
            } else if (!hash) {
                // No hash, no session -> redirect to login
                 window.location.href = './login/index.html';
            } else {
                 // Has hash but no session yet? Wait a bit longer or show error
                 // If it's a password recovery, we handle it differently
                 if (hash.includes('type=recovery')) {
                     handlePasswordReset();
                 }
            }
        });
    }, 1000);

    function handleSuccess(session) {
        spinner.style.display = 'none';
        title.textContent = 'Success!';
        message.textContent = 'Redirecting you to the arena...';

        // Ensure localStorage is set (SupabaseAuthService does this, but let's be sure)
        localStorage.setItem('dualmind.auth.supabase', JSON.stringify({
            user: session.user,
            session: session
        }));
        localStorage.setItem('dualmind.auth.token', session.access_token);

        setTimeout(() => {
            window.location.href = './index.html';
        }, 800);
    }

    function showError(msg) {
        spinner.style.display = 'none';
        title.textContent = 'Error';
        message.innerHTML = msg;
    }

    function handlePasswordReset() {
      // Extract reset token from URL
      const params = new URLSearchParams(hash.substring(1));
      const accessToken = params.get('access_token');
      const type = params.get('type');

      if (accessToken && type === 'recovery') {
        // ... (Keep existing password reset logic if needed, or redirect to a reset page)
        // For now, let's just confirm it's detected
        title.textContent = 'Reset Password';
        message.textContent = 'Redirecting to password reset...';
        // You might want a dedicated reset page, but for now:
        // window.location.href = './reset-password.html#' + hash.substring(1);
      }
    }
  </script>
</body>
</html>
