<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmation - DualMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Inria+Sans:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inria Sans', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: 400px;
    }

    .logo {
      margin-bottom: 30px;
    }

    .logo-icon {
      display: inline-block;
      width: 60px;
      height: 60px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-family: 'Do Hyeon', sans-serif;
    }

    p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
      font-size: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #4AABC2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
    }

    .message.success {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #69f0ae;
    }

    .message.error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #ff6b6b;
    }

    .link {
      color: #4AABC2;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .link:hover {
      color: white;
    }
  </style>
  <script src="./config.js"></script>
  <script src="./js/resend-auth-email.js"></script>
</head>

<body>
  <div class="container">
    <div class="logo">
      <img src="./assets/logo.png" alt="DualMind Logo" class="logo-icon" style="width: 60px; height: auto;">
    </div>

    <h1 id="title">Confirming Email...</h1>
    <p id="message">Please wait while we confirm your email address.</p>

    <div class="spinner" id="spinner"></div>

    <div id="status" style="display: none;">
      <!-- Will be updated by script -->
    </div>

    <p style="margin-top: 40px; font-size: 13px;">
      Redirecting to <a class="link" href="./index.html">DualMind</a> in <span id="countdown">5</span> seconds...
    </p>
  </div>

  <script type="module">
    import { initializeSupabaseAuth } from './js/supabase-auth.js';

    const supabaseConfig = window.DUALMIND_CONFIG.supabase;
    const searchParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));

    if (!supabaseConfig.url || supabaseConfig.url.includes('your-project')) {
      document.getElementById('title').textContent = 'Configuration Error';
      document.getElementById('message').innerHTML = 'Supabase not configured. <a class="link" href="./login-modern.html">Back to login</a>';
      document.getElementById('spinner').style.display = 'none';
      throw new Error('Supabase config missing');
    }

    const auth = initializeSupabaseAuth(supabaseConfig.url, supabaseConfig.anonKey);
    const spinner = document.getElementById('spinner');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    const countdown = document.getElementById('countdown');
    const authType = hashParams.get('type') || searchParams.get('type') || '';
    const shouldSendWelcome = searchParams.get('welcome') === '1' || authType === 'signup';
    const isRecoveryFlow = authType === 'recovery' || searchParams.get('mode') === 'resetPassword';

    let countdownValue = 5;

    if (window.DualMindResendEmail?.registerClient && auth.supabase) {
      window.DualMindResendEmail.registerClient(auth.supabase);
    }

    function getRedirectTarget() {
      if (window.location.hostname === 'localhost') {
        return 'http://localhost:8000/index.html';
      }
      return './index.html';
    }

    function getLoginTarget() {
      if (window.location.hostname === 'localhost') {
        return 'http://localhost:8000/login-modern.html';
      }
      return './login-modern.html';
    }

    function startRedirectCountdown(targetUrl) {
      countdownValue = 5;
      countdown.textContent = String(countdownValue);

      const redirectInterval = setInterval(() => {
        countdownValue -= 1;
        countdown.textContent = String(countdownValue);

        if (countdownValue <= 0) {
          clearInterval(redirectInterval);
          window.location.href = targetUrl;
        }
      }, 1000);
    }

    async function waitForSession(timeoutMs = 5000) {
      await new Promise((resolve) => setTimeout(resolve, 500));

      try {
        const { data } = await auth.supabase.auth.getSession();
        if (data?.session) {
          return data.session;
        }
      } catch (error) {
        console.warn('Immediate session lookup failed:', error);
      }

      return new Promise((resolve) => {
        let settled = false;
        let timer = null;
        let listener = null;

        const finish = (session) => {
          if (settled) return;
          settled = true;

          if (timer) {
            clearTimeout(timer);
          }

          const subscription = listener?.data?.subscription;
          if (subscription?.unsubscribe) {
            subscription.unsubscribe();
          }

          resolve(session || null);
        };

        timer = setTimeout(() => finish(null), timeoutMs);

        listener = auth.supabase.auth.onAuthStateChange((event, session) => {
          if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') && session) {
            finish(session);
          }
        });
      });
    }

    async function maybeSendWelcomeEmail(session) {
      if (!shouldSendWelcome) return;
      if (window.DUALMIND_CONFIG?.email?.sendWelcomeOnSignUp === false) return;
      if (!window.DualMindResendEmail || !session?.user?.id) return;

      const sentKey = `dualmind.auth.welcome-confirmed:${session.user.id}`;
      if (sessionStorage.getItem(sentKey) === '1') {
        return;
      }

      window.DualMindResendEmail.syncSession(session);

      try {
        const result = await window.DualMindResendEmail.sendWelcome({
          redirectUrl: `${window.location.origin}/index.html`
        });

        if (result?.success) {
          sessionStorage.setItem(sentKey, '1');
        } else {
          console.warn('Welcome email send failed:', result);
        }
      } catch (error) {
        console.warn('Welcome email send threw an error:', error);
      }
    }

    async function checkSession() {
      const session = await waitForSession();

      if (!session) {
        return false;
      }

      await maybeSendWelcomeEmail(session);

      spinner.style.display = 'none';
      title.textContent = 'Authentication Successful!';
      message.textContent = 'You have successfully signed in. Redirecting to the app...';
      status.style.display = 'block';
      status.innerHTML = '<div class="message success">Redirecting to DualMind Arena...</div>';

      setTimeout(() => {
        window.location.href = getRedirectTarget();
      }, 1500);

      return true;
    }

    async function handleEmailConfirmation() {
      const session = await waitForSession();
      if (session) {
        await maybeSendWelcomeEmail(session);
      }

      spinner.style.display = 'none';
      title.textContent = 'Email Confirmed!';
      message.textContent = session
        ? 'Your email has been verified. Redirecting you into DualMind now.'
        : 'Your email has been verified. You can now use all features.';
      status.style.display = 'block';
      status.innerHTML = '<div class="message success">Redirecting to app...</div>';

      startRedirectCountdown(getRedirectTarget());
    }

    function showConfirmationError() {
      spinner.style.display = 'none';
      title.textContent = 'Confirmation Error';
      message.textContent = 'We could not finish confirming your session. Please try signing in.';
      status.style.display = 'block';
      status.innerHTML = `<div class="message error">Go back to <a class="link" href="${getLoginTarget()}">Login</a>.</div>`;
    }

    function handlePasswordReset() {
      const accessToken = hashParams.get('access_token');
      const type = hashParams.get('type');

      if (accessToken && type === 'recovery') {
        sessionStorage.setItem('resetToken', accessToken);

        spinner.style.display = 'none';
        title.textContent = 'Reset Your Password';
        message.textContent = 'You can now set a new password for your account.';
        status.style.display = 'block';
        status.innerHTML = `
          <div style="margin: 20px 0;">
            <input type="password" id="newPassword" placeholder="New password"
              style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; margin-bottom: 10px;">
            <input type="password" id="confirmPassword" placeholder="Confirm password"
              style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; margin-bottom: 10px;">
            <button onclick="resetPassword()" style="width: 100%; padding: 10px; background: #4AABC2; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold;">
              Reset Password
            </button>
          </div>
        `;

        window.resetPassword = async function () {
          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          if (!newPassword || !confirmPassword) {
            alert('Please fill in both password fields');
            return;
          }

          if (newPassword !== confirmPassword) {
            alert('Passwords do not match');
            return;
          }

          if (newPassword.length < 6) {
            alert('Password must be at least 6 characters');
            return;
          }

          try {
            const result = await auth.changePassword(newPassword);
            if (result.success) {
              spinner.style.display = 'none';
              title.textContent = 'Password Reset!';
              message.textContent = 'Your password has been successfully updated.';
              status.innerHTML = '<div class="message success">Redirecting to login...</div>';

              setTimeout(() => {
                window.location.href = getLoginTarget();
              }, 2000);
            } else {
              alert('Error: ' + result.error);
            }
          } catch (error) {
            alert('Error resetting password: ' + error.message);
          }
        };
      }
    }

    if (isRecoveryFlow) {
      handlePasswordReset();
    } else if (authType === 'email' || authType === 'signup' || shouldSendWelcome) {
      handleEmailConfirmation().catch((error) => {
        console.error('Email confirmation flow failed:', error);
        showConfirmationError();
      });
    } else {
      checkSession().then((isAuthed) => {
        if (!isAuthed) {
          spinner.style.display = 'none';
          title.textContent = 'No Active Session';
          message.textContent = 'It looks like you may have already confirmed your email or the session expired.';
          status.style.display = 'block';
          status.innerHTML = `<div class="message success">Go back to <a class="link" href="${getLoginTarget()}">Login</a>.</div>`;
        }
      });
    }
  </script>
</body>

</html>
