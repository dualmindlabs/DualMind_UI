  <script src="./config.js"></script>

  <!-- Global Error Handler - Prevents blank screen on JS failures -->
  <script>
    (function () {
      var errorShown = false;

      function showErrorBanner(message) {
        if (errorShown) return;
        errorShown = true;

        var banner = document.createElement('div');
        banner.id = 'app-error-banner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#1a1a2e;border-bottom:2px solid #ef4444;padding:16px 24px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:Outfit,sans-serif;';
        banner.innerHTML =
          '<div style="color:#fff;font-size:14px;">' +
          '<strong style="color:#ef4444;">&#9888;&#65039; App Error:</strong> ' +
          '<span style="opacity:0.9;">' + message + '</span>' +
          '</div>' +
          '<button onclick="location.reload()" style="background:#4AABC2;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">Retry</button>';

        document.body.insertBefore(banner, document.body.firstChild);

        var loading = document.getElementById('auth-loading-overlay');
        if (loading) loading.style.display = 'none';
      }

      window.onerror = function (message, source, lineno, colno, error) {
        console.error('Global error:', message, source, lineno);
        showErrorBanner('Failed to load the application. Click Retry to reload.');
        return false;
      };

      window.onunhandledrejection = function (event) {
        console.error('Unhandled rejection:', event.reason);
        if (event.reason && event.reason.message &&
          (event.reason.message.includes('Failed to fetch') ||
            event.reason.message.includes('NetworkError') ||
            event.reason.message.includes('import') ||
            event.reason.message.includes('module'))) {
          showErrorBanner('Network error occurred. Check your connection and click Retry.');
        }
      };

      window._DUALMIND_APP_READY = false;

      setTimeout(function () {
        if (!window._DUALMIND_APP_READY) {
          var loading = document.getElementById('auth-loading-overlay');
          if (loading && loading.style.display !== 'none') {
            showErrorBanner('App initialization timed out. Click Retry to reload.');
          }
        }
      }, 10000);
    })();
  </script>

  <!-- Supabase Auth Initialization (Auto-initializes if configured) -->

<body>
  <a class="skip-link" href="#chat-input">Skip to chat input</a>

  <!-- Main App Container -->

    <!-- Floating Voting UI (appears above input after both responses) -->
    <div id="floating-voting" hidden></div>

  <!-- Auth Loading Overlay - Shows until auth resolves -->
  <div id="auth-loading-overlay" style="
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: Outfit, sans-serif;
  ">
    <div style="text-align: center; color: #fff;">
      <div class="spinner" style="
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: #4AABC2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      "></div>
      <p style="margin-top: 16px; opacity: 0.8; font-size: 14px; font-family: Outfit, sans-serif;">Loading...</p>
    </div>
  </div>

  <style>
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

    `;
