name: Hard UI pass

# Manual: a hard Playwright pass (tests in web/tests/hardtest) on the composed build of master and
# of the cutover branch, and on the live preview. Artifacts: hardtest-<target> (shots + results).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  composed:
    name: Composed build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: master
            ref: master
          - name: pr87
            ref: feat/arena-cutover
    steps:
      - uses: actions/checkout@v7
        with:
          path: pass
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: site
      - name: Overlay the hard pass on the target
        run: |
          cp pass/web/playwright.hardtest.config.ts site/web/
          mkdir -p site/web/tests/hardtest
          cp pass/web/tests/hardtest/* site/web/tests/hardtest/
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/web/package-lock.json
      - name: Build the composed site
        working-directory: site
        env:
          VITE_SUPABASE_URL: https://e2eproject.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-key-not-a-real-key
        run: node build.js
      - name: Install Playwright Chromium
        working-directory: site/web
        run: |
          for attempt in 1 2 3 4; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Hard pass
        working-directory: site/web
        run: npx playwright test -c playwright.hardtest.config.ts
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardtest-${{ matrix.name }}
          path: site/web/hardtest-out/
          retention-days: 7

  live:
    name: Live preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          for attempt in 1 2 3 4; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Hard pass against the live preview
        working-directory: web
        env:
          HARD_BASE_URL: https://arena.dualmindlab.tech
        run: npx playwright test -c playwright.hardtest.config.ts
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardtest-live
          path: web/hardtest-out/
          retention-days: 7
