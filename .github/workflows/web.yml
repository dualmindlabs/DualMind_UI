name: Web app

# The React app in web/ and the composed site the dualmind-arena Worker serves.
#   check: typecheck, ESLint, Prettier, unit tests and Worker tests (Vitest).
#   e2e:   `node build.js` (the same self-contained build Cloudflare Workers Builds runs: it
#          installs and builds web/, then composes dist/ from the legacy files and the web build),
#          then the real worker.js serves dist/ in `wrangler dev`, and Playwright checks it:
#          routes and headers, hydration, theme, keyboard, overflow, axe in both themes, and
#          screenshots uploaded as the `web-screenshots` artifact.
# Nothing here deploys: Workers Builds deploys master and builds a preview for every branch.

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'server/**'
      - 'contract/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'build.js'
      - 'package.json'
      - '.node-version'
      - '.github/workflows/web.yml'
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'server/**'
      - 'contract/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'build.js'
      - 'package.json'
      - '.node-version'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Typecheck, lint, format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (react-router typegen + tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Unit and Worker tests (Vitest)
        run: npm test

      # Coverage of the typed API client (src/lib/api and its config), in the job summary.
      - name: API client coverage
        run: |
          npx vitest run --project unit tests/unit/lib/api tests/unit/config/api.test.ts \
            --coverage.enabled --coverage.provider=v8 \
            --coverage.include='src/lib/api/**' --coverage.include='src/config/api.ts' \
            --coverage.reporter=text --coverage.reporter=json-summary \
            --coverage.reportsDirectory=coverage/api
          node -e '
            const total = require("./coverage/api/coverage-summary.json").total;
            const row = ["statements", "branches", "functions", "lines"]
              .map(key => `${total[key].pct}% (${total[key].covered}/${total[key].total})`);
            console.log("### API client coverage (src/lib/api)\n");
            console.log("| Statements | Branches | Functions | Lines |\n| ---: | ---: | ---: | ---: |");
            console.log(`| ${row.join(" | ")} |`);
          ' >> "$GITHUB_STEP_SUMMARY"

      # When formatting or fixable lint rules fail, offer the fix as a patch:
      #   gh run download <run-id> -n web-autofix && git apply web-autofix.patch
      - name: Prepare an autofix patch
        if: failure()
        run: |
          npx --no-install prettier --write . > /dev/null 2>&1 || true
          npx --no-install eslint . --fix > /dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/autofix"
          git diff --binary -- . > "$RUNNER_TEMP/autofix/web-autofix.patch"
          echo "Autofix patch: $(grep -c '^diff --git' "$RUNNER_TEMP/autofix/web-autofix.patch" || true) files" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the autofix patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-autofix
          path: ${{ runner.temp }}/autofix/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Composed build, Playwright and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Dummy Supabase settings: the sign-in pages build in their working state, and the e2e
      # tests answer every call to this origin with Playwright routes (tests/e2e/auth.spec.ts).
      # Production and preview builds get the real public values from the Workers Builds build
      # variables of the same names; they are never committed.
      - name: Build the composed site (node build.js)
        id: build
        env:
          VITE_SUPABASE_URL: https://e2eproject.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-key-not-a-real-key
        run: node build.js

      - name: Check the composed dist/ and report sizes
        run: |
          set -euo pipefail
          test -f dist/design/index.html
          test -f dist/__spa-fallback.html
          for page in about how-it-works faq privacy terms cookies; do test -f dist/$page/index.html; done
          test -f dist/404.html
          ! test -e dist/404/index.html
          grep -q '/about/' dist/sitemap.xml
          ! grep -q 'design' dist/sitemap.xml
          grep -q '/login/' dist/sitemap.xml
          grep -q '/signup/' dist/sitemap.xml
          ! grep -q 'forgot-password' dist/sitemap.xml
          grep -q 'Two minds' dist/design/index.html
          grep -q 'noindex' dist/design/index.html
          # / is the prerendered landing page (slice S3), never the SPA fallback; the legacy arena
          # lives on as dist/legacy-app.html for the signed-in hand-off.
          grep -q 'Two models. One prompt.' dist/index.html
          grep -q 'legacy-app.html' dist/index.html
          ! grep -q 'data-spa-fallback' dist/index.html
          ! grep -q 'noindex' dist/index.html
          grep -q '<title>DualMind - Battle Arena</title>' dist/legacy-app.html
          grep -q 'data-spa-fallback' dist/__spa-fallback.html
          test -f dist/og/landing.png
          # Slice S7: the web app's leaderboard and models pages replace the legacy files.
          grep -q 'blind votes' dist/leaderboard/index.html
          ! grep -q 'leaderboardPage.js' dist/leaderboard/index.html
          grep -q 'Every model in' dist/models/index.html
          ! grep -q 'AI Models Comparison' dist/models/index.html
          # Slice S6: the sign-in pages are prerendered; the legacy ones are gone from dist/ (301s),
          # the email targets are client-only routes, and the CSP manifest has the Supabase origin.
          grep -q 'Welcome back to the' dist/login/index.html
          grep -q 'Two models. One prompt.' dist/signup/index.html
          grep -q 'Forgot your password?' dist/forgot-password/index.html
          for f in login-modern.html signup-modern.html forgot-password.html auth-callback.html update-password.html login/login/index.html login/auth-complete.js; do
            if [ -e "dist/$f" ]; then echo "::error::dist/$f should be gone (slice S6)"; exit 1; fi
          done
          grep -q 'https://e2eproject.supabase.co' dist/__web-manifest.json
          {
            echo "### Web build output"
            echo
            echo "| File | Size | Gzip |"
            echo "| --- | ---: | ---: |"
            for f in dist/index.html dist/design/index.html dist/leaderboard/index.html dist/models/index.html dist/login/index.html dist/signup/index.html dist/__spa-fallback.html $(ls -S dist/assets/*.js dist/assets/*.css); do
              echo "| \`${f#dist/}\` | $(wc -c < "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The WebGL effects and Motion's feature bundles must stay in their own chunks, loaded only
      # when a page uses them (components/motion/webgl-gate.tsx, motion-provider.tsx).
      - name: Check that effects are code-split and report the bundle
        run: |
          set -euo pipefail
          gz() { gzip -9c "$1" | wc -c; }
          total() { local sum=0; for f in "$@"; do sum=$((sum + $(gz "$f"))); done; echo "$sum"; }
          lazy=()
          for chunk in light-rays silk electric-border features-dom-animation features-dom-max; do
            file=$(ls dist/assets/${chunk}-*.js 2>/dev/null | head -n 1 || true)
            if [ -z "$file" ]; then
              echo "::error::Expected a separate chunk for ${chunk} in dist/assets"
              exit 1
            fi
            lazy+=("$file")
          done
          # Script files each prerendered page loads up front (modulepreload and module scripts).
          eager=$(grep -oE 'assets/[A-Za-z0-9._-]+\.js' dist/design/index.html | sort -u | sed 's#^#dist/#')
          landing=$(grep -oE 'assets/[A-Za-z0-9._-]+\.js' dist/index.html | sort -u | sed 's#^#dist/#')
          landing_css=$(grep -oE 'assets/[A-Za-z0-9._-]+\.css' dist/index.html | sort -u | sed 's#^#dist/#')
          landing_total=$(total $landing)
          {
            echo "### Bundle report"
            echo
            echo "| What | Files | Gzip (bytes) |"
            echo "| --- | ---: | ---: |"
            echo "| All JavaScript | $(ls dist/assets/*.js | wc -l) | $(total dist/assets/*.js) |"
            echo "| All CSS | $(ls dist/assets/*.css | wc -l) | $(total dist/assets/*.css) |"
            echo "| Loaded up front by / (budget 184320) | $(echo "$landing" | wc -l) | ${landing_total} |"
            echo "| CSS loaded by / | $(echo "$landing_css" | wc -l) | $(total $landing_css) |"
            echo "| Loaded up front by /design/ | $(echo "$eager" | wc -l) | $(total $eager) |"
            echo "| Lazy effect chunks (WebGL, Motion features) | ${#lazy[@]} | $(total "${lazy[@]}") |"
            echo
            echo "Lazy chunks: $(for f in "${lazy[@]}"; do printf '\`%s\` (%s B) ' "${f#dist/assets/}" "$(gz "$f")"; done)"
            echo
            echo "Up front on /, with the libraries each chunk carries (string markers):"
            echo
            echo "| Chunk | Gzip | Libraries |"
            echo "| --- | ---: | --- |"
            for f in $landing; do
              libs=""
              grep -q 'cmdk-' "$f" && libs="$libs cmdk"
              grep -q 'data-sonner-toaster' "$f" && libs="$libs sonner"
              grep -q 'vaul-drawer' "$f" && libs="$libs vaul"
              grep -q 'invalid_type' "$f" && libs="$libs zod"
              grep -q 'getClippingRect' "$f" && libs="$libs floating-ui"
              grep -q 'framerAppearId\|data-framer' "$f" && libs="$libs motion"
              grep -q 'useQueryClient\|QueryClientProvider\|No QueryClient set' "$f" && libs="$libs tanstack-query"
              grep -q 'react-router\|React Router' "$f" && libs="$libs react-router"
              grep -q 'react-dom\|__reactContainer' "$f" && libs="$libs react-dom"
              echo "| \`${f#dist/assets/}\` | $(gz "$f") |${libs:- (app code)} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "${lazy[@]}"; do
            if echo "$eager" | grep -qx "$f" || echo "$landing" | grep -qx "$f"; then
              echo "::error::${f} is loaded up front by a prerendered page; it must stay lazy"
              exit 1
            fi
          done
          # Recharts (the win-rate chart) loads only when a model's details open.
          chart=$(ls dist/assets/win-rate-chart-*.js 2>/dev/null | head -n 1 || true)
          if [ -z "$chart" ]; then
            echo "::error::Expected a separate chunk for win-rate-chart (Recharts) in dist/assets"
            exit 1
          fi
          {
            echo
            echo "| Leaderboard bundles | Files | Gzip (bytes) |"
            echo "| --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          for page in leaderboard models; do
            upfront=$(grep -oE 'assets/[A-Za-z0-9._-]+\.js' "dist/${page}/index.html" | sort -u | sed 's#^#dist/#')
            if echo "$upfront" | grep -qx "$chart"; then
              echo "::error::${chart} is loaded up front by /${page}/; it must stay lazy"
              exit 1
            fi
            echo "| Loaded up front by /${page}/ | $(echo "$upfront" | wc -l) | $(total $upfront) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| Win-rate chart with Recharts (lazy) | 1 | $(gz "$chart") |" >> "$GITHUB_STEP_SUMMARY"
          # Checked after the tests (last step), so an overrun still gets screenshots and Lighthouse.
          echo "LANDING_JS_GZIP=${landing_total}" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (wrangler dev + Chromium)
        working-directory: web
        run: npx playwright test

      # Lighthouse (mobile, simulated throttling) on the landing page through the same Worker,
      # with the preview cookie on every request. Budgets in web/lighthouserc.json: accessibility 1,
      # best practices >= 0.95 and SEO 1 fail the job; performance >= 0.9 is the target but only
      # warns for now: the shared shell, React Router, Motion and Zod load about 290 KB of gzipped
      # JavaScript up front, which caps the simulated mobile score near 0.8 (PR #40). The scores are
      # in the job summary on every run. Reports: the `lighthouse` artifact.
      - name: Start the Worker for Lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: web
        run: |
          node tests/e2e/serve-dist.mjs --port 8790 > "$RUNNER_TEMP/lighthouse-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lighthouse-server.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null -H 'Cookie: dm_preview=1' http://127.0.0.1:8790/; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/lighthouse-server.log"
          exit 1

      - name: Lighthouse CI (/, mobile)
        id: lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          # ?preview= sets the preview cookie on the first response, so the robots.txt fetch passes
          # the waitlist gate too (extraHeaders in lighthouserc.json cover the page itself).
          urls: http://127.0.0.1:8790/?preview=dualmind-preview
          configPath: ./web/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse
          temporaryPublicStorage: false

      - name: Lighthouse scores in the job summary
        if: always() && steps.lighthouse.outcome != 'skipped'
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
        run: |
          node -e '
            const runs = JSON.parse(process.env.MANIFEST || "[]");
            const representative = runs.find(run => run.isRepresentativeRun) || runs[0];
            const pct = value => (value === undefined ? "n/a" : Math.round(value * 100));
            console.log("### Lighthouse (/, mobile)\n");
            if (!representative) { console.log("No Lighthouse run."); process.exit(0); }
            console.log("| Run | Performance | Accessibility | Best practices | SEO |");
            console.log("| --- | ---: | ---: | ---: | ---: |");
            for (const run of runs) {
              const s = run.summary || {};
              console.log(`| ${run.isRepresentativeRun ? "median" : "run"} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s["best-practices"])} | ${pct(s.seo)} |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the Lighthouse Worker
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/lighthouse-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/lighthouse-server.pid")" || true; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: web/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: List the screenshots in the job summary
        if: always()
        run: |
          {
            echo "### Screenshots of /, /design/, /leaderboard/, /models/ and the sign-in pages"
            echo
            echo "Download the \`web-screenshots\` artifact from [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts):"
            echo
            for f in web/screenshots/*.png; do
              [ -e "$f" ] && echo "- \`$(basename "$f")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Marketing pages: at most 180 KB of gzipped JavaScript before any interaction
      # (docs/redesign/migration-plan.md section 7). Reported as a warning until the shared shell
      # is slimmed down (see the Lighthouse note above); the number is in the bundle report.
      - name: Check the JavaScript budget of /
        if: ${{ !cancelled() && env.LANDING_JS_GZIP != '' }}
        run: |
          if [ "$LANDING_JS_GZIP" -gt 184320 ]; then
            echo "::warning::/ loads ${LANDING_JS_GZIP} bytes of gzipped JavaScript up front; the budget is 184320 (180 KB)"
          else
            echo "/ loads ${LANDING_JS_GZIP} bytes of gzipped JavaScript up front (budget 184320)."
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
