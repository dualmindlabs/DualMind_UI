name: Deploy waitlist

# Deploys the waitlist (Cloudflare Worker `dualmind-waitlist`, early.dualmindlab.tech) from
# waitlist-worker/: applies new D1 migrations to the `dualmind-waitlist` database, then runs
# `wrangler deploy`, which builds the page (see wrangler.jsonc) and uploads it with the Worker.
#
# Runs on every push to master that touches waitlist-worker/, and by hand:
#   gh workflow run deploy-waitlist.yml -R dualmindlabs/DualMind_UI
#
# Needs the repository secret CLOUDFLARE_API_TOKEN: a Cloudflare API token (My Profile > API Tokens
# > Create Token) limited to the DualMind Labs account, with at least:
#   Account > Workers Scripts > Edit
#   Account > D1 > Edit
# The easy way: start from the "Edit Cloudflare Workers" template and add Account > D1 > Edit.
# The custom domain early.dualmindlab.tech is attached in the dashboard, not in wrangler.jsonc, so
# the deploy doesn't change routes. The account ID isn't secret, so it is set below.

on:
  push:
    branches: [master]
    paths:
      - 'waitlist-worker/**'
      - '.github/workflows/deploy-waitlist.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one half way.
concurrency:
  group: deploy-waitlist
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: waitlist-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ce26b52f735d01c85c31b3ff4c74d3bd
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_VERSION: 4.149.0

    steps:
      - name: Check the Cloudflare API token secret
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN secret::Add a repository secret named CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions): a Cloudflare API token for the DualMind Labs account with Account > Workers Scripts > Edit and Account > D1 > Edit. Then re-run: gh workflow run deploy-waitlist.yml -R dualmindlabs/DualMind_UI"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: waitlist-worker/package-lock.json

      # Records each file in migrations/ as applied. 0001 matches the table that was created by
      # hand and uses IF NOT EXISTS, so on that database it changes nothing.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply dualmind-waitlist --remote

      # wrangler.jsonc's build step runs `npm ci && npm run build` before the upload.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy

      - name: Check the live site
        run: |
          set -u
          for attempt in 1 2 3 4 5 6; do
            page=$(curl -fsS "https://early.dualmindlab.tech/?deploy-check=$GITHUB_RUN_ID" || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' "https://early.dualmindlab.tech/api/signup" || true)
            if printf '%s' "$page" | grep -q 'id="email"' && [ "$api" = "405" ]; then
              echo "early.dualmindlab.tech serves the page and /api/signup answers GET with 405."
              exit 0
            fi
            echo "Not live yet (page check, /api/signup GET -> $api); retrying in 10 s"
            sleep 10
          done
          echo "::error title=Deploy check failed::early.dualmindlab.tech doesn't serve the new Worker yet: /api/signup answered $api instead of 405."
          exit 1
