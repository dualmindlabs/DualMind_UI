<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DualMind Arena — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth-styles.css">
  <script src="../config.js"></script>
  <style>
    /* Login Page Specific Overrides */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #000000; /* Pure black background as requested */
      overflow: hidden;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-logo {
      font-size: 36px;
      margin-bottom: 16px;
      display: inline-block;
      color: #ffffff;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
      display: block;
    }

    .form-input {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 0 16px;
      font-size: 15px;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: #ffffff;
      color: #000000;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      font-size: 15px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .divider {
      margin: 28px 0;
      position: relative;
      text-align: center;
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 0; top: 50%;
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider span {
      position: relative;
      background: #141414; /* Matches card bg somewhat to hide line */
      padding: 0 12px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
    }

    /* Fix for the divider span background matching the card */
    .login-card .divider span {
      background: transparent; /* Changed to transparent since card has blur */
      /* To hide the line behind text, we can use a text-shadow or box-shadow hack,
         but simpler to just clear the background on the line for that segment.
         Actually, let's just use a solid background that matches the visual perception
         or just let the line be there but fade it out?
         Let's stick to a solid color that approximates the dark theme */
      background: #181818;
      border-radius: 4px;
    }

    .social-login {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .social-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .social-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toggle-link {
      margin-top: 24px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .toggle-link a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }

    /* Error message */
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-size: 13px;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
      text-align: left;
      line-height: 1.4;
    }

    .spin-anim {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="../theme.js"></script>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-logo"><i class="ri-sword-line"></i></div>
      <h1 class="brand-title">DualMind Arena</h1>
      <p class="brand-subtitle">Sign in to battle AI models</p>

      <div id="errorMsg" class="error-msg"></div>

      <form id="authForm">
        <div class="form-group" id="nameField" style="display: none;">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="John Doe">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span>Sign In</span>
          <i class="ri-arrow-right-line"></i>
        </button>
      </form>

      <div class="divider"><span>Or continue with</span></div>

      <div class="social-login">
        <button type="button" class="social-btn" id="googleBtn">
          <i class="ri-google-fill"></i> Google
        </button>
        <!-- Phone Login Support -->
        <button type="button" class="social-btn" id="phoneBtn" title="Coming Soon" disabled>
          <i class="ri-smartphone-line"></i> Phone
        </button>
      </div>

      <p class="toggle-link" id="toggleText">
        Don't have an account? <a href="#" id="toggleBtn">Sign up</a>
      </p>

      <p class="toggle-link">
        <a href="../index.html" style="color: rgba(255,255,255,0.4); font-size: 13px;"><i class="ri-arrow-left-line"></i> Back to Arena</a>
      </p>
    </div>
  </div>

  <!-- Supabase JS client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    // Config
    const SUPABASE_URL = window.DUALMIND_CONFIG?.supabase?.url || 'https://calqfzajyidkdzbaswjp.supabase.co';
    const SUPABASE_ANON_KEY = window.DUALMIND_CONFIG?.supabase?.anonKey || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbHFmemFqeWlka2R6YmFzd2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNzMwODMsImV4cCI6MjA3OTg0OTA4M30.ptXyUNCcAhGi9u2kVDHOxSBvQv0W72S5HHqkIFXQS08';
    const SERVER_URL = window.DUALMIND_CONFIG?.serverUrl || 'http://localhost:65476';
    const SITE_URL = window.DUALMIND_CONFIG?.siteUrl || window.location.origin;

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // State
    let isLogin = true;

    // Elements
    const form = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const nameInput = document.getElementById('fullName');
    const nameField = document.getElementById('nameField');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const errorMsg = document.getElementById('errorMsg');
    const googleBtn = document.getElementById('googleBtn');
    const phoneBtn = document.getElementById('phoneBtn');
    const title = document.querySelector('.brand-title');
    const subtitle = document.querySelector('.brand-subtitle');

    // Toggle Login/Signup
    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isLogin = !isLogin;

      if (isLogin) {
        title.textContent = 'DualMind Arena';
        subtitle.textContent = 'Sign in to battle AI models';
        nameField.style.display = 'none';
        nameInput.required = false;
        submitBtn.innerHTML = '<span>Sign In</span><i class="ri-arrow-right-line"></i>';
        toggleText.innerHTML = 'Don\'t have an account? <a href="#" id="toggleBtn">Sign up</a>';
      } else {
        title.textContent = 'Create Account';
        subtitle.textContent = 'Join the arena and rank models';
        nameField.style.display = 'block';
        nameInput.required = true;
        submitBtn.innerHTML = '<span>Create Account</span><i class="ri-user-add-line"></i>';
        toggleText.innerHTML = 'Already have an account? <a href="#" id="toggleBtn">Sign in</a>';
      }

      // Re-bind event listener since innerHTML replaced the element
      document.getElementById('toggleBtn').addEventListener('click', (ev) => {
        ev.preventDefault();
        toggleBtn.click();
      });

      errorMsg.style.display = 'none';
    });

    // Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const name = nameInput.value.trim();

      if (!email || !password) return;
      if (!isLogin && !name) return;

      setLoading(true);
      errorMsg.style.display = 'none';

      try {
        if (isLogin) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          if (!data.session) {
            throw new Error('Login failed - no session returned');
          }

          handleSuccessfulLogin(data);

        } else {
          // Signup
          const parts = name.split(' ');
          const first = parts[0];
          const last = parts.slice(1).join(' ') || '';

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: name,
                first_name: first,
                last_name: last
              },
              emailRedirectTo: `${window.location.origin}/auth-callback.html`
            }
          });

          if (error) throw error;

          // Store session if available
          if (data.session) {
            handleSuccessfulLogin(data);
          } else {
            // Email confirmation required
            errorMsg.style.display = 'block';
            errorMsg.style.background = 'rgba(59, 130, 246, 0.1)';
            errorMsg.style.borderColor = 'rgba(59, 130, 246, 0.2)';
            errorMsg.style.color = '#60a5fa';
            errorMsg.textContent = 'Registration successful! Please check your email to confirm your account.';
            
            setTimeout(() => {
              isLogin = true;
              toggleBtn.click();
            }, 3000);
          }
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      } finally {
        setLoading(false);
      }
    });

    // Google Login
    googleBtn.addEventListener('click', async () => {
      try {
        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: `${window.location.origin}/auth-callback.html`
          }
        });
        if (error) throw error;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      }
    });

    // Phone Login Placeholder (needs actual implementation if Supabase SMS is set up)
    // Disabled in UI
    /*
    phoneBtn.addEventListener('click', () => {
       // Placeholder for phone login UI switch
       alert("Phone login feature coming soon.");
    });
    */

    async function handleSuccessfulLogin(data) {
      // Store session for the app
      localStorage.setItem('dualmind.auth.supabase', JSON.stringify({
        user: data.user,
        session: data.session
      }));

      localStorage.setItem('dualmind.auth.token', data.session.access_token);

      // Check if admin
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const response = await fetch(`${SERVER_URL}/api/admin/check`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${data.session.access_token}`,
            'Content-Type': 'application/json'
          },
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (response.ok) {
          const result = await response.json();
          if (result.success && result.is_admin) {
            window.location.href = window.DUALMIND_CONFIG?.adminUrl || '../index.html';
            return;
          }
        }
      } catch (checkError) {
        console.log('Admin check failed, proceeding to main app:', checkError);
      }

      // Redirect to main app with safety check
      const rawRedirect = new URLSearchParams(window.location.search).get('redirect');
      let redirectUrl = '../index.html'; // Safe default

      if (rawRedirect) {
          try {
            // Construct absolute URL to check origin and path traversal
            const url = new URL(rawRedirect, window.location.origin);

            // Security Checks:
            // 1. Must be same origin
            // 2. Must NOT contain /../ (path traversal) or backslashes
            // 3. Must NOT be an absolute URL with a different protocol (e.g. javascript:)
            if (
                url.origin === window.location.origin &&
                !url.pathname.includes('/../') &&
                !url.pathname.includes('\\')
            ) {
                // If it's a root-relative path or safe absolute path, use it.
                // We prefer the pathname + search + hash to ensure we stay on the same origin.
                redirectUrl = url.pathname + url.search + url.hash;
            }
          } catch (e) {
            // Invalid URL, stick to default
            console.warn('Invalid redirect URL:', rawRedirect);
          }
      }

      window.location.href = redirectUrl;
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        submitBtn.innerHTML = '<i class="ri-loader-4-line spin-anim"></i><span>Processing...</span>';
      } else {
        submitBtn.innerHTML = isLogin
          ? '<span>Sign In</span><i class="ri-arrow-right-line"></i>'
          : '<span>Create Account</span><i class="ri-user-add-line"></i>';
      }
    }
  </script>
</body>
</html>
