<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMU - Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../theme.js"></script>
</head>
<body>
    <div class="container">
        <div class="main-wrapper">
            <!-- Left Side - Animated Background -->
            <div class="left-side">
            <div class="background-slideshow">
                <div class="slide active"></div>
                <div class="slide"></div>
                <div class="slide"></div>
            </div>
            <div class="overlay"></div>
            <div class="content">
                <div class="logo">AMU</div>
                <div class="back-to-website">
                    <a href="../index.html">Back to website →</a>
                </div>
                <div class="main-content">
                    <h1 id="left-title">Welcome Back!<br>We Missed You</h1>
                    <p id="left-subtitle">Sign in to continue your creative journey and access all your amazing content.</p>
                    <div class="progress-dots">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="right-side">
            <div class="form-container">
                <div class="form-section">
                    <h2 id="form-title">Welcome back</h2>
                    <p class="switch-form" id="switch-text">
                        <span id="switch-label">Don't have an account?</span>
                        <a href="#" id="form-toggle">Register</a>
                    </p>
                    
                    <form id="auth-form">
                        <div class="form-row" id="name-row" style="display: none;">
                            <div class="input-group">
                                <input type="text" id="firstName" placeholder="First name">
                            </div>
                            <div class="input-group">
                                <input type="text" id="lastName" placeholder="Last name">
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <input id="email" type="email" placeholder="Email" required>
                        </div>
                        
                        <div class="input-group password-group">
                            <input id="password" type="password" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z" stroke="currentColor" stroke-width="2"/>
                                    <path d="M2.458 12C3.732 7.943 7.523 5 12 5C16.478 5 20.268 7.943 21.542 12C20.268 16.057 16.478 19 12 19C7.523 19 3.732 16.057 2.458 12Z" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </button>
                        </div>
                        
                        <div class="checkbox-group" id="terms-row" style="display: none;">
                            <input type="checkbox" id="terms">
                            <label for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
                        </div>
                        
                        <div id="form-message" class="form-message"></div>
                        <button type="submit" class="submit-btn" id="submit-btn">
                            <span class="btn-text">Sign in</span>
                            <span class="btn-loader" style="display: none;">
                                <svg class="spinner" viewBox="0 0 24 24" width="20" height="20">
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4" stroke-linecap="round"/>
                                </svg>
                                <span class="loader-text">Please wait...</span>
                            </span>
                        </button>
                        
                        <div class="divider" id="divider-text">
                            <span>Or sign in with</span>
                        </div>
                        
                        <div class="social-buttons">
                            <button type="button" class="social-btn google-btn" id="googleBtn">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17.64 9.20454C17.64 8.56636 17.5827 7.95272 17.4764 7.36363H9V10.8445H13.8436C13.635 11.9699 13.0009 12.9231 12.0477 13.5613V15.8195H14.9564C16.6582 14.2527 17.64 11.9454 17.64 9.20454Z" fill="#4285F4"/>
                                    <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5613C11.2418 14.1013 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8372 3.96409 10.71H0.957275V13.0418C2.43818 15.9831 5.48182 18 9 18Z" fill="#34A853"/>
                                    <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29V4.95818H0.957273C0.347727 6.17318 0 7.54772 0 9C0 10.4523 0.347727 11.8268 0.957273 13.0418L3.96409 10.71Z" fill="#FBBC04"/>
                                    <path d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/>
                                </svg>
                                Google
                            </button>
                            <button type="button" class="social-btn apple-btn">
                                <svg width="16" height="20" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12.6298 10.6942C12.6182 9.09623 13.5867 7.85563 15.0238 7.14563C14.2201 6.01139 12.9635 5.39745 11.2817 5.27995C9.68341 5.16536 8.02827 6.31669 7.24573 6.31669C6.44192 6.31669 5.07494 5.30222 3.79494 5.30222C1.13507 5.34513 -1.6239 7.35835 -1.6239 11.4544C-1.6239 12.7436 -1.35036 14.0841 -0.803354 15.4758C-0.0555381 17.4022 1.69653 20.5744 3.5828 20.5744C4.81049 20.5744 5.67335 19.6797 7.22446 19.6797C8.74429 19.6797 9.55391 20.5744 10.8699 20.5744C12.7794 20.5744 14.363 17.7377 15.0821 15.8036C12.1017 14.5024 12.6298 10.8066 12.6298 10.6942ZM10.3173 3.53222C11.3173 2.32304 11.2173 1.22245 11.1881 0.800049C10.3056 0.854851 9.26827 1.44169 8.65827 2.19882C7.99618 3.01445 7.67618 3.99639 7.77744 5.05336C8.73308 5.12263 9.67436 4.56154 10.3173 3.53222Z" fill="currentColor"/>
                                </svg>
                                Apple
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- Supabase JS client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
        // TODO: Replace with your real Supabase values from Project Settings -> API
        const SUPABASE_URL = 'https://calqfzajyidkdzbaswjp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbHFmemFqeWlka2R6YmFzd2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNzMwODMsImV4cCI6MjA3OTg0OTA4M30.ptXyUNCcAhGi9u2kVDHOxSBvQv0W72S5HHqkIFXQS08';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginForm = true;
        let isAnimating = false;

        function toggleForm() {
            if (isAnimating) return;
            isAnimating = true;

            const formTitle = document.getElementById('form-title');
            const switchText = document.getElementById('switch-text');
            const submitBtn = document.getElementById('submit-btn');
            const nameRow = document.getElementById('name-row');
            const termsRow = document.getElementById('terms-row');
            const dividerText = document.getElementById('divider-text');
            const socialButtons = document.querySelector('.social-buttons');
            const leftTitle = document.getElementById('left-title');
            const leftSubtitle = document.getElementById('left-subtitle');
            const leftSide = document.querySelector('.left-side');
            const rightSide = document.querySelector('.right-side');
            const formSection = document.querySelector('.form-section');

            formSection.classList.remove('fade-in');
            formSection.classList.add('fade-out');

            setTimeout(function() {
                if (isLoginForm) {
                    // Switch to Register form
                    formTitle.textContent = 'Create an account';
                    switchText.innerHTML = 'Already have an account? <a href="#" id="form-toggle">Log In</a>';
                    submitBtn.querySelector('.btn-text').textContent = 'Create account';
                    nameRow.style.display = 'flex';
                    termsRow.style.display = 'flex';
                    dividerText.style.display = 'flex';
                    socialButtons.style.display = 'flex';
                    dividerText.querySelector('span').textContent = 'Or register in with';
                    leftTitle.innerHTML = 'Capturing Moments,<br>Creating Memories';
                    leftSubtitle.textContent = 'Join our creative community and start sharing your amazing moments with the world.';
                    leftSide.classList.add('swapped');
                    rightSide.classList.add('swapped');
                    isLoginForm = false;
                } else {
                    // Switch to Login form
                    formTitle.textContent = 'Welcome back';
                    switchText.innerHTML = 'Don\'t have an account? <a href="#" id="form-toggle">Register</a>';
                    submitBtn.querySelector('.btn-text').textContent = 'Sign in';
                    nameRow.style.display = 'none';
                    termsRow.style.display = 'none';
                    dividerText.style.display = 'flex';
                    socialButtons.style.display = 'flex';
                    dividerText.querySelector('span').textContent = 'Or login in with';
                    leftTitle.innerHTML = 'Welcome Back!<br>We Missed You';
                    leftSubtitle.textContent = 'Sign in to continue your creative journey and access all your amazing content.';
                    leftSide.classList.remove('swapped');
                    rightSide.classList.remove('swapped');
                    isLoginForm = true;
                }

                // Re-attach event listener to the new toggle link
                document.getElementById('form-toggle').addEventListener('click', function(e) {
                    e.preventDefault();
                    toggleForm();
                });

                formSection.classList.remove('fade-out');
                formSection.classList.add('fade-in');

                setTimeout(function() {
                    formSection.classList.remove('fade-in');
                    isAnimating = false;
                }, 300);
            }, 300);
        }

        // Helper functions for UI feedback
        function showMessage(text, type = 'error') {
            const msgEl = document.getElementById('form-message');
            msgEl.textContent = text;
            msgEl.className = 'form-message ' + type;
            msgEl.style.display = 'block';
        }

        function hideMessage() {
            const msgEl = document.getElementById('form-message');
            msgEl.style.display = 'none';
            msgEl.textContent = '';
        }

        function setLoading(loading, text = 'Please wait...') {
            const btn = document.getElementById('submit-btn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoader = btn.querySelector('.btn-loader');
            const loaderText = btn.querySelector('.loader-text');
            
            if (loading) {
                btn.disabled = true;
                btnText.style.display = 'none';
                btnLoader.style.display = 'flex';
                loaderText.textContent = text;
            } else {
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        }

        // Validation functions
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function validateName(name) {
            return name.trim().length >= 2;
        }

        // Initial event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle between Login and Register
            document.getElementById('form-toggle').addEventListener('click', function(e) {
                e.preventDefault();
                toggleForm();
            });

            // Handle form submit (login / register)
            const authForm = document.getElementById('auth-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const termsCheckbox = document.getElementById('terms');

            authForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessage();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Validate email
                if (!email) {
                    showMessage('Please enter your email address');
                    emailInput.focus();
                    return;
                }
                if (!validateEmail(email)) {
                    showMessage('Please enter a valid email address');
                    emailInput.focus();
                    return;
                }

                // Validate password
                if (!password) {
                    showMessage('Please enter your password');
                    passwordInput.focus();
                    return;
                }
                if (!validatePassword(password)) {
                    showMessage('Password must be at least 6 characters');
                    passwordInput.focus();
                    return;
                }

                // Additional validation for registration
                if (!isLoginForm) {
                    const firstName = firstNameInput.value.trim();
                    const lastName = lastNameInput.value.trim();

                    if (!validateName(firstName)) {
                        showMessage('Please enter your first name (at least 2 characters)');
                        firstNameInput.focus();
                        return;
                    }
                    if (!validateName(lastName)) {
                        showMessage('Please enter your last name (at least 2 characters)');
                        lastNameInput.focus();
                        return;
                    }
                    if (!termsCheckbox.checked) {
                        showMessage('Please agree to the Terms & Conditions');
                        return;
                    }
                }

                try {
                    if (isLoginForm) {
                        // Login with email & password
                        setLoading(true, 'Signing in...');
                        
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email,
                            password
                        });

                        if (error) {
                            setLoading(false);
                            showMessage('Login failed: ' + error.message);
                            return;
                        }

                        showMessage('Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '../index.html';
                        }, 1000);
                    } else {
                        // Register a new account with first/last name
                        setLoading(true, 'Creating your account...');
                        
                        const firstName = firstNameInput.value.trim();
                        const lastName = lastNameInput.value.trim();

                        const { data, error } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: {
                                data: {
                                    first_name: firstName,
                                    last_name: lastName,
                                    full_name: firstName + ' ' + lastName
                                }
                            }
                        });

                        if (error) {
                            setLoading(false);
                            showMessage('Registration failed: ' + error.message);
                            return;
                        }

                        showMessage('Account created successfully! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '../index.html';
                        }, 1500);
                    }
                } catch (err) {
                    setLoading(false);
                    showMessage('Unexpected error: ' + err.message);
                }
            });

            // Google OAuth login
            const googleBtn = document.getElementById('googleBtn');
            googleBtn.addEventListener('click', async function() {
                try {
                    showMessage('Redirecting to Google...', 'success');
                    const { data, error } = await supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + '/index.html'
                        }
                    });

                    if (error) {
                        showMessage('Google login failed: ' + error.message);
                    }
                } catch (err) {
                    showMessage('Unexpected error: ' + err.message);
                }
            });
        });
    </script>
</body>
</html>
