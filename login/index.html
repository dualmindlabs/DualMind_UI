<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DualMind Arena — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth-styles.css">
  <script src="../config.js"></script>
  <style>
    /* Login Page Specific Overrides */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-0);
      overflow: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(0, 0, 0, .22)), var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-logo {
      font-size: 32px;
      margin-bottom: 8px;
      display: inline-block;
      color: var(--text-1);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-3);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      color: var(--text-1);
      padding: 0 14px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: rgba(138, 180, 255, .35);
      box-shadow: 0 0 0 1px rgba(138, 180, 255, .15), 0 0 0 4px rgba(138, 180, 255, .08);
      background: rgba(255, 255, 255, .05);
    }

    .submit-btn {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      font-size: 14px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .divider {
      margin: 24px 0;
      position: relative;
      text-align: center;
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: var(--line);
    }

    .divider span {
      position: relative;
      background: var(--bg-1);
      padding: 0 10px;
      color: var(--text-3);
      font-size: 12px;
    }

    .social-login {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
      color: var(--text-1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, .06);
      border-color: var(--text-3);
    }

    .toggle-link {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-2);
    }

    .toggle-link a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }

    /* Auth Tabs */
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: 12px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .auth-tab:hover:not(.active) {
      background: rgba(255, 255, 255, 0.05);
    }

    /* Forgot Password */
    .forgot-password {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 16px;
    }

    .forgot-password a {
      font-size: 12px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    /* Success Message */
    .success-msg {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #4ade80;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
    }

    /* Background glow effects */
    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Error message */
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
    }
  </style>
  <script src="../theme.js"></script>
</head>

<body>
  <div class="bg-glow"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-logo"><i class="ri-sword-line"></i></div>
      <h1 class="brand-title">DualMind Arena</h1>
      <p class="brand-subtitle">Sign in to battle AI models</p>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <!-- Auth Method Tabs -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-method="email">Email</button>
        <button type="button" class="auth-tab" data-method="phone">Phone</button>
      </div>

      <form id="authForm">
        <div class="form-group" id="nameField" style="display: none;">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="John Doe">
        </div>

        <!-- Email Auth Fields -->
        <div id="emailFields">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••"
              autocomplete="current-password">
          </div>

          <div class="forgot-password" id="forgotPasswordLink">
            <a href="#" id="forgotBtn">Forgot password?</a>
          </div>
        </div>

        <!-- Phone Auth Fields -->
        <div id="phoneFields" style="display: none;">
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-input" placeholder="Enter 10-digit mobile number"
              autocomplete="tel">
          </div>

          <div class="form-group" id="otpField" style="display: none;">
            <label class="form-label" for="otp">Verification Code</label>
            <input type="text" id="otp" class="form-input" placeholder="123456" maxlength="6">
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span>Sign In</span>
          <i class="ri-arrow-right-line"></i>
        </button>
      </form>

      <div class="divider"><span>Or continue with</span></div>

      <div class="social-login">
        <button type="button" class="social-btn" id="googleBtn">
          <i class="ri-google-fill"></i> Google
        </button>
      </div>

      <p class="toggle-link" id="toggleText">
        Don't have an account? <a href="#" id="toggleBtn">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>

  <script src="../js/resend-auth-email.js"></script>
  <script src="auth-complete.js"></script>

  <script>
    // Config
    const SUPABASE_URL = window.DUALMIND_CONFIG?.supabase?.url || 'https://calqfzajyidkdzbaswjp.supabase.co';
    const SUPABASE_ANON_KEY = window.DUALMIND_CONFIG?.supabase?.anonKey || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbHFmemFqeWlka2R6YmFzd2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNzMwODMsImV4cCI6MjA3OTg0OTA4M30.ptXyUNCcAhGi9u2kVDHOxSBvQv0W72S5HHqkIFXQS08';
    const SERVER_URL = window.DUALMIND_CONFIG?.serverUrl || 'http://localhost:5079';
    const SITE_URL = window.DUALMIND_CONFIG?.siteUrl || window.location.origin;

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (window.DualMindResendEmail?.registerClient) {
      window.DualMindResendEmail.registerClient(supabaseClient);
    }

    // State
    let isLogin = true;

    // Check if already logged in or handling a magic link
    async function checkExistingSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        // Store session for the app
        localStorage.setItem('dualmind.auth.supabase', JSON.stringify({
          user: session.user,
          session: session
        }));

        // Redirect to main app
        const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '../index.html';
        window.location.href = redirectUrl;
      }

      // Listen for auth changes (Magic Link, OAuth)
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
          localStorage.setItem('dualmind.auth.supabase', JSON.stringify({
            user: session.user,
            session: session
          }));
          const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '../index.html';
          window.location.href = redirectUrl;
        }
      });
    }
    checkExistingSession();

    // Elements
    const form = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const nameInput = document.getElementById('fullName');
    const nameField = document.getElementById('nameField');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const googleBtn = document.getElementById('googleBtn');
    const forgotBtn = document.getElementById('forgotBtn');
    const title = document.querySelector('.brand-title');
    const subtitle = document.querySelector('.brand-subtitle');

    // Toggle Login/Signup
    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isLogin = !isLogin;

      if (isLogin) {
        title.textContent = 'DualMind Arena';
        subtitle.textContent = 'Sign in to battle AI models';
        nameField.style.display = 'none';
        nameInput.required = false;
        submitBtn.innerHTML = '<span>Sign In</span><i class="ri-arrow-right-line"></i>';
        toggleText.innerHTML = 'Don\'t have an account? <a href="#" id="toggleBtn">Sign up</a>';
      } else {
        title.textContent = 'Create Account';
        subtitle.textContent = 'Join the arena and rank models';
        nameField.style.display = 'block';
        nameInput.required = true;
        submitBtn.innerHTML = '<span>Create Account</span><i class="ri-user-add-line"></i>';
        toggleText.innerHTML = 'Already have an account? <a href="#" id="toggleBtn">Sign in</a>';
      }

      // Re-bind event listener since innerHTML replaced the element
      document.getElementById('toggleBtn').addEventListener('click', (ev) => {
        ev.preventDefault();
        toggleBtn.click();
      });

      errorMsg.style.display = 'none';
    });

    // Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const name = nameInput.value.trim();

      if (!email || !password) return;
      if (!isLogin && !name) return;

      setLoading(true);
      errorMsg.style.display = 'none';

      try {
        if (isLogin) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          if (!data.session) {
            throw new Error('Login failed - no session returned');
          }

          // Store session for the app
          localStorage.setItem('dualmind.auth.supabase', JSON.stringify({
            user: data.user,
            session: data.session
          }));

          if (window.DualMindResendEmail) {
            window.DualMindResendEmail.syncSession(data.session);
          }

          // Check if admin
          try {
            const response = await fetch(`${SERVER_URL}/api/admin/check`, {
              method: 'GET',
              headers: {
                'Authorization': `Bearer ${data.session.access_token}`,
                'Content-Type': 'application/json'
              }
            });

            if (response.ok) {
              const result = await response.json();
              if (result.success && result.is_admin) {
                window.location.href = '../../DM_admin_UI/public/admin.html';
                return;
              }
            }
          } catch (checkError) {
            console.log('Admin check failed, proceeding to main app:', checkError);
          }

          // Redirect to main app
          const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '../index.html';
          window.location.href = redirectUrl;
        } else {
          // Signup
          const parts = name.split(' ');
          const first = parts[0];
          const last = parts.slice(1).join(' ') || '';

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: name,
                first_name: first,
                last_name: last
              }
            }
          });

          if (error) throw error;

          // Store session if available
          if (data.session) {
            localStorage.setItem('dualmind.auth.supabase', JSON.stringify({
              user: data.user,
              session: data.session
            }));

            if (window.DualMindResendEmail) {
              window.DualMindResendEmail.syncSession(data.session);
              if (window.DUALMIND_CONFIG?.email?.sendWelcomeOnSignUp !== false) {
                void window.DualMindResendEmail.sendWelcome({
                  redirectUrl: '../index.html'
                });
              }
            }

            // Show success message
            errorMsg.style.display = 'block';
            errorMsg.style.background = 'rgba(34, 197, 94, 0.1)';
            errorMsg.style.borderColor = 'rgba(34, 197, 94, 0.2)';
            errorMsg.style.color = '#4ade80';
            errorMsg.textContent = 'Account created successfully! Redirecting...';

            setTimeout(() => {
              window.location.href = '../index.html';
            }, 1500);
          } else {
            // Email confirmation required
            errorMsg.style.display = 'block';
            errorMsg.style.background = 'rgba(59, 130, 246, 0.1)';
            errorMsg.style.borderColor = 'rgba(59, 130, 246, 0.2)';
            errorMsg.style.color = '#60a5fa';
            errorMsg.textContent = 'Registration successful! Please check your email to confirm your account.';

            setTimeout(() => {
              isLogin = true;
              toggleBtn.click();
            }, 3000);
          }
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      } finally {
        setLoading(false);
      }
    });

    // Forgot Password
    forgotBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      
      if (!email) {
        errorMsg.textContent = 'Please enter your email address';
        errorMsg.style.display = 'block';
        emailInput.focus();
        return;
      }

      setLoading(true);
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: `${SITE_URL}/auth-callback.html?mode=resetPassword`
        });

        if (error) throw error;

        successMsg.textContent = 'Password reset email sent! Please check your inbox.';
        successMsg.style.display = 'block';
        
        setTimeout(() => {
          successMsg.style.display = 'none';
        }, 10000);
      } catch (err) {
        errorMsg.textContent = err.message || 'Failed to send password reset email';
        errorMsg.style.display = 'block';
      } finally {
        setLoading(false);
      }
    });

    // Google Login
    googleBtn.addEventListener('click', async () => {
      try {
        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: `${SITE_URL}/index.html`
          }
        });
        if (error) throw error;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        submitBtn.innerHTML = '<i class="ri-loader-4-line spin-anim"></i><span>Processing...</span>';
      } else {
        submitBtn.innerHTML = isLogin
          ? '<span>Sign In</span><i class="ri-arrow-right-line"></i>'
          : '<span>Create Account</span><i class="ri-user-add-line"></i>';
      }
    }
  </script>
</body>

</html>
