<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="View a shared DualMind AI battle thread">
    <meta name="theme-color" content="#000000">

    <title>Shared Thread - DualMind Arena</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Markdown & Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/shared-thread.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 21 21'><rect width='9' height='9' rx='1' fill='%23577B87'/><rect x='12' width='9' height='9' rx='1' fill='%234AABC2'/><rect x='12' y='12' width='9' height='9' rx='1' fill='%23CB9275'/><rect y='12' width='9' height='9' rx='1' fill='%23FDF4CD'/></svg>">

    <!-- Config -->
    <script src="../config.js"></script>
</head>

<body>
    <div class="bg-glow"></div>
    <!-- Premium Background Image -->
    <img src="../assets/background.png" class="app-background" alt="" aria-hidden="true">

    <!-- Main Container -->
    <div id="shared-thread-container"></div>

    <!-- Loading Overlay -->
    <div id="shared-loading-overlay" style="
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: Inter, sans-serif;
  ">
        <div style="text-align: center; color: #fff;">
            <div class="spinner" style="
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: #4AABC2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      "></div>
            <p style="margin-top: 16px; opacity: 0.8; font-size: 14px;">Loading shared thread...</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Scripts -->
    <script type="module">
        import { SharedThreadView } from '../components/SharedThreadView.js';

        // Wait for DOM and config to be ready
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Setup marked.js for markdown rendering
                if (window.marked && window.hljs) {
                    window.marked.setOptions({
                        highlight: function (code, lang) {
                            if (lang && window.hljs.getLanguage(lang)) {
                                return window.hljs.highlight(code, { language: lang }).value;
                            }
                            return window.hljs.highlightAuto(code).value;
                        },
                        breaks: true,
                        gfm: true
                    });
                }

                // Initialize the API service if available
                const config = window.DUALMIND_CONFIG || {};
                const baseUrl = config.apiBaseUrl || config.api?.baseUrl || 'http://localhost:5079';

                // Create simple API wrapper for shared thread view
                window._API = {
                    async fetchThread(threadId) {
                        const response = await fetch(`${baseUrl}/api/threads/${threadId}`);
                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error || `Failed to load thread: ${response.status}`);
                        }
                        return await response.json();
                    },
                    async getThreadMessages(threadId) {
                        const response = await fetch(`${baseUrl}/api/threads/${threadId}/messages`);
                        if (!response.ok) {
                            throw new Error(`Failed to load messages: ${response.status}`);
                        }
                        const data = await response.json();
                        return data.items || data || [];
                    }
                };

                // Initialize shared thread view
                new SharedThreadView('shared-thread-container');

                // Hide loading overlay
                const loadingOverlay = document.getElementById('shared-loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.style.display = 'none';
                }
            } catch (error) {
                console.error('Error initializing shared thread view:', error);

                // Show error
                const container = document.getElementById('shared-thread-container');
                if (container) {
                    container.innerHTML = `
            <div class="shared-thread-error">
              <div class="error-icon">⚠️</div>
              <h2>Failed to Load</h2>
              <p>${error.message}</p>
              <button class="retry-btn" onclick="location.reload()">Retry</button>
              <a href="/" class="home-link">Go to Home</a>
            </div>
          `;
                }

                // Hide loading overlay
                const loadingOverlay = document.getElementById('shared-loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.style.display = 'none';
                }
            }
        });
    </script>
</body>

</html>
